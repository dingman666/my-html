<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AWS小助理IP格式修改器</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    :root {
        --primary: #2563eb;
        --bg: #f1f5f9;
        --card: #ffffff;
        --text: #1e293b;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 20px;
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
    }

    .container {
        max-width: 900px;
        margin: auto;
        background: var(--card);
        border-radius: 12px;
        padding: 25px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    textarea {
        width: 100%;
        height: 150px;
        resize: vertical;
        padding: 12px;
        font-size: 14px;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
    }

    .buttons {
        margin: 15px 0;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
    }

    .format-select {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
    }

    select {
        padding: 10px 14px;
        font-size: 14px;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        background: #fff;
        color: var(--text);
        cursor: pointer;
    }

    button {
        padding: 10px 18px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
        background: var(--primary);
        color: #fff;
        transition: 0.2s;
    }

    button:hover {
        opacity: 0.85;
    }

    .output {
        background: #0f172a;
        color: #22d3ee;
        border-radius: 10px;
        padding: 15px;
        margin-top: 10px;
        max-height: 400px;
        overflow-y: auto;
    }

    .line {
        padding: 6px 8px;
        border-radius: 6px;
        cursor: pointer;
        transition: 0.2s;
    }

    .line:hover {
        background: rgba(255,255,255,0.08);
    }

    .toast {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: #111827;
        color: #fff;
        padding: 10px 20px;
        border-radius: 8px;
        display: none;
        z-index: 9999;
    }

    footer {
        text-align: center;
        margin-top: 20px;
        font-size: 13px;
        color: #64748b;
    }
</style>
  <link rel="icon" href="./icon.png">
</head>
<body>

<h1>☁️ AWS小助理IP格式修改器</h1>

<div class="container">
    <textarea id="input" placeholder="每行一个：
165.254.37.117:36377:QYlwfOYd:4B5xPczPy9"></textarea>

    <div class="buttons">
        <label class="format-select">
            协议格式：
            <select id="protocol" onchange="convert()">
                <option value="http">http</option>
                <option value="https">https</option>
                <option value="socks5">socks5</option>
                <option value="socks5h">socks5h</option>
                <option value="socks4">socks4</option>
            </select>
        </label>
        <button onclick="convert()">🚀 开始转换</button>
        <button onclick="copyAll()">📋 一键复制全部</button>
    </div>

    <div id="output" class="output"></div>
</div>

<div class="toast" id="toast">✅ 已复制到剪贴板</div>

<footer>Made with ❤️ by AWS小助理</footer>

<script>
function convert() {
    const input = document.getElementById("input").value.trim();
    const lines = input.split(/\r?\n/);
    const output = document.getElementById("output");
    const protocol = document.getElementById("protocol").value;
    output.innerHTML = "";

    let index = 1;
    lines.forEach(line => {
        line = line.trim();
        if (!line) return;

        const parts = line.split(":");
        if (parts.length !== 4) {
            output.innerHTML += `<div class="line"># 格式错误：${line}</div>`;
            return;
        }

        const [ip, port, user, pass] = parts;
        const result = `${protocol}://${user}:${pass}@${ip}:${port}`;

        const div = document.createElement("div");
        div.className = "line";
        div.textContent = `${index}. ${result}`;
        div.onclick = () => copyText(result);
        output.appendChild(div);

        index++;
    });
}

function copyAll() {
    const text = Array.from(document.querySelectorAll(".line"))
        .map(l => l.textContent.replace(/^\d+\.\s*/, ""))
        .join("\n");

    if (!text) return;
    navigator.clipboard.writeText(text);
    showToast();
}

function copyText(text) {
    navigator.clipboard.writeText(text);
    showToast();
}

function showToast() {
    const toast = document.getElementById("toast");
    toast.style.display = "block";
    setTimeout(() => toast.style.display = "none", 1500);
}
</script>

</body>
</html>
