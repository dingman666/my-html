<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文字转二维码</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --text-secondary: #6e6e73;
    --accent: #0071e3;
    --accent-hover: #0077ed;
    --control-bg: #ebebf0;
    --input-bg: #f5f5f7;
    --divider: rgba(0, 0, 0, 0.08);
    --shadow: 0 2px 16px rgba(0, 0, 0, 0.06);
    --segment-active: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161617;
      --card: #1d1d1f;
      --text: #f5f5f7;
      --text-secondary: #86868b;
      --accent: #0a84ff;
      --accent-hover: #3395ff;
      --control-bg: #2c2c2e;
      --input-bg: #2c2c2e;
      --divider: rgba(255, 255, 255, 0.1);
      --shadow: 0 2px 16px rgba(0, 0, 0, 0.4);
      --segment-active: #5a5a5e;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
                 "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    transition: background 0.3s ease;
  }

  .container {
    max-width: 1080px;
    margin: 0 auto;
    padding: 56px 24px 80px;
  }

  header { text-align: center; margin-bottom: 48px; }

  h1 {
    font-size: 48px;
    font-weight: 600;
    letter-spacing: -0.015em;
    line-height: 1.1;
  }

  .subtitle {
    margin-top: 12px;
    font-size: 19px;
    font-weight: 400;
    color: var(--text-secondary);
    letter-spacing: 0.011em;
  }

  .layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    align-items: start;
  }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
    h1 { font-size: 36px; }
    .container { padding-top: 40px; }
  }

  .card {
    background: var(--card);
    border-radius: 18px;
    padding: 28px;
    box-shadow: var(--shadow);
  }

  .field-label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 10px;
    letter-spacing: -0.01em;
  }
  .field-label .count {
    font-size: 12px;
    font-weight: 400;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }

  textarea {
    width: 100%;
    height: 190px;
    border: none;
    outline: none;
    resize: vertical;
    background: var(--input-bg);
    color: var(--text);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 16px;
    font-family: inherit;
    line-height: 1.5;
    box-shadow: 0 0 0 1.5px transparent;
    transition: box-shadow 0.2s ease;
  }
  textarea:focus { box-shadow: 0 0 0 3px var(--accent); }
  textarea::placeholder { color: var(--text-secondary); }

  .option-group { margin-top: 24px; }
  .option-title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 10px;
    letter-spacing: -0.01em;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .option-title .hint {
    font-size: 12px;
    font-weight: 400;
    color: var(--text-secondary);
  }

  .segmented {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    background: var(--control-bg);
    border-radius: 9px;
    padding: 2px;
    gap: 2px;
  }
  .segmented button {
    border: none;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 7px 0;
    border-radius: 7px;
    cursor: pointer;
    transition: background 0.18s ease, box-shadow 0.18s ease;
  }
  .segmented button.active {
    background: var(--segment-active);
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
    font-weight: 600;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: var(--control-bg);
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #ffffff;
    box-shadow: 0 1px 5px rgba(0, 0, 0, 0.25), 0 0 0 0.5px rgba(0, 0, 0, 0.05);
    cursor: grab;
    transition: transform 0.15s ease;
  }
  input[type="range"]::-webkit-slider-thumb:active { cursor: grabbing; transform: scale(1.08); }
  input[type="range"]::-moz-range-thumb {
    width: 24px;
    height: 24px;
    border: none;
    border-radius: 50%;
    background: #ffffff;
    box-shadow: 0 1px 5px rgba(0, 0, 0, 0.25);
    cursor: grab;
  }

  .color-row { display: flex; gap: 24px; }
  .color-item { display: flex; align-items: center; gap: 10px; }
  .color-item span { font-size: 13px; color: var(--text-secondary); }
  input[type="color"] {
    -webkit-appearance: none;
    appearance: none;
    width: 34px;
    height: 34px;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    background: transparent;
    padding: 0;
  }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 3px; }
  input[type="color"]::-webkit-color-swatch {
    border-radius: 50%;
    border: 1px solid var(--divider);
  }
  input[type="color"]::-moz-color-swatch {
    border-radius: 50%;
    border: 1px solid var(--divider);
  }

  .preview-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 480px;
  }

  .qr-stage {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 0 20px;
  }

  .qr-frame {
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.10), 0 0 0 1px var(--divider);
    line-height: 0;
    background: #fff;
  }
  #qrCanvas {
    display: block;
    width: min(320px, 72vw);
    height: auto;
  }

  .placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    color: var(--text-secondary);
  }
  .placeholder svg { opacity: 0.35; }
  .placeholder p { font-size: 15px; }

  .qr-meta {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 18px;
    font-variant-numeric: tabular-nums;
    min-height: 15px;
  }

  .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

  .btn {
    border: none;
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    padding: 11px 24px;
    border-radius: 980px;
    cursor: pointer;
    transition: background 0.18s ease, opacity 0.18s ease, transform 0.1s ease;
    letter-spacing: -0.01em;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.35; cursor: default; transform: none; }

  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:not(:disabled):hover { background: var(--accent-hover); }

  .btn-secondary { background: var(--control-bg); color: var(--text); }
  .btn-secondary:not(:disabled):hover { filter: brightness(0.96); }
  @media (prefers-color-scheme: dark) {
    .btn-secondary:not(:disabled):hover { filter: brightness(1.2); }
  }

  .error-msg {
    color: #ff3b30;
    font-size: 14px;
    text-align: center;
    padding: 0 20px;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 40px;
    transform: translateX(-50%) translateY(80px);
    background: rgba(50, 50, 54, 0.82);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    padding: 12px 24px;
    border-radius: 980px;
    opacity: 0;
    pointer-events: none;
    transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.35s ease;
    z-index: 100;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  footer {
    text-align: center;
    margin-top: 48px;
    font-size: 12px;
    color: var(--text-secondary);
  }
</style>
  <link rel="icon" href="./icon.png">
</head>
<body>
<div class="container">
  <header>
    <h1>文字转二维码</h1>
    <p class="subtitle">输入文字，即刻生成。简单、纯粹、离线可用。</p>
  </header>

  <div class="layout">
    <!-- 输入与选项 -->
    <section class="card">
      <div class="field-label">
        <span>文字内容</span>
        <span class="count" id="charCount">0 字符</span>
      </div>
      <textarea id="textInput" placeholder="输入任意文字、网址或联系方式…" autofocus></textarea>

      <div class="option-group">
        <div class="option-title">
          <span>容错级别</span>
          <span class="hint" id="ecHint">中 · 可遮挡约 15%</span>
        </div>
        <div class="segmented" id="ecControl">
          <button data-ec="L">低</button>
          <button data-ec="M" class="active">中</button>
          <button data-ec="Q">较高</button>
          <button data-ec="H">高</button>
        </div>
      </div>

      <div class="option-group">
        <div class="option-title">
          <span>导出尺寸</span>
          <span class="hint" id="sizeLabel">512 × 512 px</span>
        </div>
        <input type="range" id="sizeRange" min="256" max="1024" step="64" value="512">
      </div>

      <div class="option-group">
        <div class="option-title"><span>颜色</span></div>
        <div class="color-row">
          <div class="color-item">
            <input type="color" id="fgColor" value="#1d1d1f">
            <span>前景</span>
          </div>
          <div class="color-item">
            <input type="color" id="bgColor" value="#ffffff">
            <span>背景</span>
          </div>
        </div>
      </div>
    </section>

    <!-- 预览与导出 -->
    <section class="card preview-card">
      <div class="qr-stage">
        <div class="placeholder" id="placeholder">
          <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
            <rect x="3" y="3" width="7" height="7" rx="1.5"/>
            <rect x="14" y="3" width="7" height="7" rx="1.5"/>
            <rect x="3" y="14" width="7" height="7" rx="1.5"/>
            <path d="M14 14h3v3h-3zM18 18h3v3h-3zM14 20v1M21 14h-1"/>
          </svg>
          <p>二维码将在这里显示</p>
        </div>
        <div class="qr-frame" id="qrFrame" style="display:none">
          <canvas id="qrCanvas"></canvas>
        </div>
        <p class="error-msg" id="errorMsg" style="display:none"></p>
      </div>
      <p class="qr-meta" id="qrMeta"></p>
      <div class="actions">
        <button class="btn btn-primary" id="downloadBtn" disabled>下载 PNG</button>
        <button class="btn btn-secondary" id="copyBtn" disabled>拷贝图片</button>
        <button class="btn btn-secondary" id="clearBtn" disabled>清空</button>
      </div>
    </section>
  </div>

  <footer>本页面完全离线运行，你的内容不会离开这台设备。</footer>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  var textInput = document.getElementById('textInput');
  var charCount = document.getElementById('charCount');
  var ecControl = document.getElementById('ecControl');
  var ecHint = document.getElementById('ecHint');
  var sizeRange = document.getElementById('sizeRange');
  var sizeLabel = document.getElementById('sizeLabel');
  var fgColor = document.getElementById('fgColor');
  var bgColor = document.getElementById('bgColor');
  var canvas = document.getElementById('qrCanvas');
  var qrFrame = document.getElementById('qrFrame');
  var placeholder = document.getElementById('placeholder');
  var errorMsg = document.getElementById('errorMsg');
  var qrMeta = document.getElementById('qrMeta');
  var downloadBtn = document.getElementById('downloadBtn');
  var copyBtn = document.getElementById('copyBtn');
  var clearBtn = document.getElementById('clearBtn');
  var toast = document.getElementById('toast');

  var ecLevel = 'M';
  var ecNames = { L: '低 · 可遮挡约 7%', M: '中 · 可遮挡约 15%', Q: '较高 · 可遮挡约 25%', H: '高 · 可遮挡约 30%' };
  var debounceTimer = null;
  var toastTimer = null;
  var hasQR = false;

  // 中文等多字节字符需按 UTF-8 编码写入二维码
  if (typeof qrcode.stringToBytesFuncs === 'object' && qrcode.stringToBytesFuncs['UTF-8']) {
    qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2000);
  }

  function setButtons(enabled) {
    downloadBtn.disabled = !enabled;
    copyBtn.disabled = !enabled;
    clearBtn.disabled = textInput.value.length === 0;
  }

  function render() {
    var text = textInput.value;
    charCount.textContent = text.length + ' 字符';
    clearBtn.disabled = text.length === 0;

    if (!text.trim()) {
      hasQR = false;
      qrFrame.style.display = 'none';
      errorMsg.style.display = 'none';
      placeholder.style.display = 'flex';
      qrMeta.textContent = '';
      setButtons(false);
      return;
    }

    try {
      var qr = qrcode(0, ecLevel);
      qr.addData(text);
      qr.make();

      var count = qr.getModuleCount();
      var quiet = 4; // 标准静区
      var total = count + quiet * 2;
      var target = parseInt(sizeRange.value, 10);
      var cell = Math.max(1, Math.floor(target / total));
      var size = cell * total;

      canvas.width = size;
      canvas.height = size;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = bgColor.value;
      ctx.fillRect(0, 0, size, size);
      ctx.fillStyle = fgColor.value;
      for (var r = 0; r < count; r++) {
        for (var c = 0; c < count; c++) {
          if (qr.isDark(r, c)) {
            ctx.fillRect((c + quiet) * cell, (r + quiet) * cell, cell, cell);
          }
        }
      }

      hasQR = true;
      placeholder.style.display = 'none';
      errorMsg.style.display = 'none';
      qrFrame.style.display = 'block';
      qrFrame.style.background = bgColor.value;
      qrMeta.textContent = size + ' × ' + size + ' px · ' + count + ' × ' + count + ' 模块 · 容错 ' + ecLevel;
      setButtons(true);
    } catch (e) {
      hasQR = false;
      qrFrame.style.display = 'none';
      placeholder.style.display = 'none';
      errorMsg.textContent = '内容过长，无法生成二维码。请缩短文字或降低容错级别。';
      errorMsg.style.display = 'block';
      qrMeta.textContent = '';
      setButtons(false);
    }
  }

  function renderDebounced() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(render, 120);
  }

  textInput.addEventListener('input', renderDebounced);

  ecControl.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    ecLevel = btn.dataset.ec;
    ecHint.textContent = ecNames[ecLevel];
    var buttons = ecControl.querySelectorAll('button');
    for (var i = 0; i < buttons.length; i++) buttons[i].classList.remove('active');
    btn.classList.add('active');
    render();
  });

  sizeRange.addEventListener('input', function () {
    sizeLabel.textContent = sizeRange.value + ' × ' + sizeRange.value + ' px';
    render();
  });

  fgColor.addEventListener('input', render);
  bgColor.addEventListener('input', render);

  downloadBtn.addEventListener('click', function () {
    if (!hasQR) return;
    var a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = '二维码_' + canvas.width + 'px.png';
    a.click();
    showToast('已开始下载');
  });

  copyBtn.addEventListener('click', function () {
    if (!hasQR) return;
    if (!navigator.clipboard || !window.ClipboardItem) {
      showToast('当前浏览器不支持拷贝图片，请使用下载');
      return;
    }
    canvas.toBlob(function (blob) {
      if (!blob) { showToast('拷贝失败'); return; }
      navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
        .then(function () { showToast('已拷贝到剪贴板'); })
        .catch(function () { showToast('拷贝失败，请使用下载'); });
    }, 'image/png');
  });

  clearBtn.addEventListener('click', function () {
    textInput.value = '';
    textInput.focus();
    render();
  });

  render();
})();
</script>
</body>
</html>
