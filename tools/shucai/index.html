<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蔬菜录入</title>
<style>
  :root{
    --bg:#f5f5f7;
    --card:#ffffff;
    --card-2:#fbfbfd;
    --text:#1d1d1f;
    --text-2:#6e6e73;
    --line:#e3e3e6;
    --blue:#0071e3;
    --blue-press:#0064c8;
    --green:#34c759;
    --red:#ff3b30;
    --shadow:0 8px 30px rgba(0,0,0,.06);
    --radius:20px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#000000;
      --card:#1c1c1e;
      --card-2:#2c2c2e;
      --text:#f5f5f7;
      --text-2:#98989d;
      --line:#3a3a3c;
      --blue:#0a84ff;
      --blue-press:#409cff;
      --shadow:0 8px 30px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding:0 0 60px;
  }
  .wrap{max-width:820px;margin:0 auto;padding:0 20px;}

  /* Header */
  header{
    text-align:center;
    padding:46px 0 26px;
  }
  header .logo{
    font-size:44px;line-height:1;margin-bottom:10px;
  }
  header h1{
    font-size:30px;font-weight:700;letter-spacing:-.02em;margin:0;
  }
  header p{color:var(--text-2);margin:6px 0 0;font-size:15px;}

  /* Segmented control */
  .seg{
    display:flex;gap:4px;background:var(--card-2);
    border:1px solid var(--line);
    padding:4px;border-radius:14px;margin:0 auto 26px;max-width:360px;
  }
  .seg button{
    flex:1;border:0;background:transparent;color:var(--text);
    font-size:15px;font-weight:600;padding:9px 0;border-radius:10px;
    cursor:pointer;transition:.2s;font-family:inherit;
  }
  .seg button.active{
    background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);
  }

  /* Card */
  .card{
    background:var(--card);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:24px;margin-bottom:20px;
    border:1px solid var(--line);
  }
  .card h2{font-size:19px;font-weight:700;margin:0 0 4px;}
  .card .sub{color:var(--text-2);font-size:13.5px;margin:0 0 18px;}

  label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin:0 0 7px;}

  textarea,input[type=text],input[type=password],select{
    width:100%;font-family:inherit;font-size:15px;color:var(--text);
    background:var(--card-2);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;outline:none;transition:.15s;resize:vertical;
  }
  textarea:focus,input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,113,227,.15);}
  textarea{min-height:150px;line-height:1.7;}
  .out{min-height:150px;white-space:pre-wrap;}

  /* Buttons */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    border:0;border-radius:980px;font-family:inherit;font-size:15px;font-weight:600;
    padding:11px 22px;cursor:pointer;transition:.15s;
    background:var(--blue);color:#fff;
  }
  .btn:hover{filter:brightness(1.05);}
  .btn:active{transform:scale(.97);}
  .btn.gray{background:var(--card-2);color:var(--text);border:1px solid var(--line);}
  .btn.green{background:var(--green);}
  .btn.ghost{background:transparent;color:var(--blue);padding:11px 14px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn.small{padding:8px 16px;font-size:14px;}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
  .grow{flex:1;min-width:0;}
  .spacer{flex:1;}

  /* Field grid */
  .field{margin-bottom:16px;}
  .field:last-child{margin-bottom:0;}
  .pw{position:relative;}
  .pw .toggle{
    position:absolute;right:10px;top:50%;transform:translateY(-50%);
    background:transparent;border:0;color:var(--text-2);cursor:pointer;font-size:13px;padding:4px 6px;
  }

  /* Status pill */
  .status{font-size:13.5px;font-weight:600;padding:8px 0;min-height:20px;}
  .status.ok{color:var(--green);}
  .status.err{color:var(--red);}
  .status.info{color:var(--text-2);}

  /* Drop zone */
  .drop{
    border:2px dashed var(--line);border-radius:16px;
    padding:34px 20px;text-align:center;cursor:pointer;transition:.15s;
    background:var(--card-2);color:var(--text-2);
  }
  .drop.hover{border-color:var(--blue);background:rgba(0,113,227,.06);color:var(--blue);}
  .drop .big{font-size:34px;margin-bottom:8px;}
  .drop .hint{font-size:13px;margin-top:6px;opacity:.8;}
  .preview{margin-top:14px;text-align:center;display:none;}
  .preview img{max-width:100%;max-height:340px;border-radius:14px;border:1px solid var(--line);}
  .preview .rm{margin-top:10px;}

  .divider{height:1px;background:var(--line);margin:20px 0;border:0;}
  .tag{display:inline-block;font-size:12px;font-weight:600;color:var(--text-2);background:var(--card-2);border:1px solid var(--line);border-radius:8px;padding:3px 9px;margin-left:8px;}

  .spin{
    width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;
    border-radius:50%;animation:sp .7s linear infinite;
  }
  @keyframes sp{to{transform:rotate(360deg);}}
  .hidden{display:none !important;}
  .toast{
    position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
    background:rgba(30,30,32,.95);color:#fff;padding:11px 22px;border-radius:12px;
    font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:99;
    box-shadow:0 8px 30px rgba(0,0,0,.3);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  footer{text-align:center;color:var(--text-2);font-size:12.5px;margin-top:26px;}
  .collapse-head{display:flex;align-items:center;cursor:pointer;user-select:none;}
  .collapse-head .chev{margin-left:auto;transition:.2s;color:var(--text-2);}
  .collapse-head.open .chev{transform:rotate(90deg);}
  details summary{list-style:none;}
  details summary::-webkit-details-marker{display:none;}
</style>
  <link rel="icon" href="./icon.png">
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">🥬</div>
    <h1>蔬菜录入</h1>
    <p>叫货清单整理 · 图片智能识别</p>
  </header>

  <div class="seg">
    <button id="tabTextBtn" class="active" onclick="switchTab('text')">文本整理</button>
    <button id="tabImgBtn" onclick="switchTab('img')">图片识别</button>
  </div>

  <!-- ================= 文本整理 ================= -->
  <section id="tabText">
    <div class="card">
      <h2>去除编号和冒号</h2>
      <p class="sub">粘贴叫货清单，一键去掉「序号」和「冒号」，冒号变成空格，方便复制到订单里识别。</p>

      <div class="field">
        <label>原始清单</label>
        <textarea id="rawText" spellcheck="false"></textarea>
      </div>

      <div class="row">
        <button class="btn" onclick="cleanText()">✨ 去除编号和冒号</button>
        <button class="btn gray small" onclick="resetText()">恢复示例</button>
        <button class="btn gray small" onclick="document.getElementById('rawText').value='';">清空</button>
      </div>

      <hr class="divider">

      <div class="field">
        <label>整理结果</label>
        <textarea id="outText" class="out" readonly spellcheck="false" placeholder="点击上方按钮生成结果…"></textarea>
      </div>
      <div class="row">
        <button class="btn green" onclick="copyEl('outText')">📋 复制结果</button>
      </div>
    </div>
  </section>

  <!-- ================= 图片识别 ================= -->
  <section id="tabImg" class="hidden">

    <!-- API 配置 -->
    <div class="card">
      <details id="apiDetails">
        <summary>
          <div class="collapse-head" id="apiHead" onclick="toggleApi(event)">
            <div>
              <h2 style="margin:0;">中转站 API 配置 <span class="tag" id="apiTag">未配置</span></h2>
              <p class="sub" style="margin:4px 0 0;">填入中转站地址和密钥，自动获取可用模型</p>
            </div>
            <span class="chev">›</span>
          </div>
        </summary>

        <div style="margin-top:18px;">
          <div class="field">
            <label>接口地址（Base URL）</label>
            <input type="text" id="baseUrl" placeholder="例如：https://api.xxxx.com  或  https://api.xxxx.com/v1" spellcheck="false">
          </div>
          <div class="field">
            <label>API 密钥（Key）</label>
            <div class="pw">
              <input type="password" id="apiKey" placeholder="sk-..." spellcheck="false">
              <button class="toggle" type="button" onclick="togglePw()">显示</button>
            </div>
          </div>

          <div class="field">
            <label>模型（点右侧按钮自动获取）</label>
            <div class="row">
              <select id="modelSel" class="grow"><option value="">— 请先获取模型 —</option></select>
              <button class="btn gray small" id="fetchBtn" onclick="fetchModels()">🔄 获取模型</button>
            </div>
          </div>

          <div class="field">
            <label>接口格式</label>
            <select id="apiFmt">
              <option value="auto">自动识别（推荐）</option>
              <option value="openai">OpenAI 格式（/v1/chat/completions）</option>
              <option value="anthropic">Anthropic · Claude 格式（/v1/messages）</option>
            </select>
          </div>

          <div class="status info" id="apiStatus"></div>

          <div class="row">
            <button class="btn green" onclick="saveApi()">💾 保存</button>
            <button class="btn gray" id="testBtn" onclick="testApi()">📡 测试连通性</button>
          </div>
        </div>
      </details>
    </div>

    <!-- 图片识别 -->
    <div class="card">
      <h2>图片识别</h2>
      <p class="sub">上传/粘贴图片，AI 自动提取品种与数量。默认：提取有数量的品种，品种间用逗号隔开。</p>

      <div class="drop" id="dropZone">
        <div class="big">🖼️</div>
        <div><b>点击选择图片</b>，或把图片拖到这里</div>
        <div class="hint">也支持直接 Ctrl+V 粘贴截图</div>
        <input type="file" id="fileInput" accept="image/*" class="hidden">
      </div>
      <div class="preview" id="preview">
        <img id="previewImg" alt="预览">
        <div class="rm"><button class="btn gray small" onclick="clearImg()">✕ 移除图片</button></div>
      </div>

      <div class="field" style="margin-top:18px;">
        <label>输出格式</label>
        <select id="outFmt" onchange="onFmtChange()">
          <option value="list">清单格式（每行一个 · 带备注 · 自动去编号去冒号）</option>
          <option value="comma">逗号分隔（品种,数量,品种,数量…）</option>
        </select>
      </div>

      <div class="field">
        <label>识别要求（可自行修改）</label>
        <textarea id="prompt" style="min-height:80px;"></textarea>
      </div>

      <div class="row">
        <button class="btn" id="recBtn" onclick="recognize()">🔍 开始识别</button>
        <button class="btn gray small" onclick="resetPrompt()">恢复默认要求</button>
      </div>

      <div class="status info" id="recStatus"></div>

      <hr class="divider">

      <div class="field">
        <label>识别结果</label>
        <textarea id="recOut" class="out" spellcheck="false" placeholder="识别结果会显示在这里…"></textarea>
      </div>
      <div class="row">
        <button class="btn green" onclick="copyEl('recOut')">📋 复制结果</button>
        <button class="btn gray small" onclick="sendToText()">→ 发送到「文本整理」</button>
      </div>
    </div>
  </section>

  <footer>蔬菜录入 · 本地运行，数据只存在你的电脑上 🍃</footer>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------- 默认清单 ---------- */
const SAMPLE = `成都大悦城店 2026-07-17 叫货
供应商：小菜仓
1.香菇：3斤
2.平菇：2.5斤
3.金针菇：1斤
备注：紧实的
4.虫草花：1袋
5.黄瓜：10斤
备注：细嫩的10根
6.芹菜：4斤
7.西兰花：1斤
备注：1朵
8.凤尾：5斤
备注：好的
9.青笋头：4斤
备注：4根
10.生菜：3斤
11.老南瓜：10斤
备注：1个大的
12.冬瓜：6斤
备注：中段
13.大土豆：8斤
备注：黄心大土豆
14.藕：3斤
备注：3节
15.芋儿：1.5斤
16.白豆皮：3斤
17.卤豆皮：1袋
备注：4斤
18.米凉粉：4斤
19.豆泡：0.5斤
20.茴香菜：1斤
21.娃娃菜1：2包
22.薄荷叶：0.5斤
23.血皮菜：1斤
24.老姜：2斤
25.西红柿：12斤
26.头骨：10斤
27.大香菜：0.3斤
28.大蒜：1袋
备注：4.5斤
29.莲白：4斤
备注：1棵
30.折耳根：4斤
31.红小米椒：2斤
32.小葱：6斤
33.香菜：8斤
34.油条：8根
35.红苕尖：2斤
36.簸箕豆腐：4斤
37.鸡蛋：1斤
备注：1板`;

/* 两种识别输出格式对应的提示词 */
const PROMPTS = {
  list: `请识别这张叫货单/清单图片，按从上到下的顺序逐行提取，输出成纯文本清单，严格遵守：
1. 保留表头信息行，如店名、日期、"叫货"、供应商等（例如「成都大悦城店 2026-07-17 叫货」「供应商 小菜仓」）。
2. 每个品种单独占一行，格式为「品种 数量」，品种与数量之间用一个空格，例如「香菇 3斤」。
3. 只保留有数量的品种，没有数量的品种跳过。
4. 若某品种带有备注，另起一行输出「备注 内容」，例如「备注 紧实的」。
5. 去掉所有序号（如 1. 2. 39.）；不要用冒号，一律用空格代替。
6. 直接输出清单文本，不要任何多余解释、表格或代码块。`,
  comma: "提取有数量的品种，保留品种和数量，品种间用逗号隔开。只输出结果，不要多余解释。"
};
const DEFAULT_FMT = 'list';

/* ---------- 初始化 ---------- */
document.getElementById('rawText').value = SAMPLE;
document.getElementById('outFmt').value = DEFAULT_FMT;
document.getElementById('prompt').value = PROMPTS[DEFAULT_FMT];
let imageDataUrl = null;

/* 单行清洗：去行首序号 + 冒号换空格 + 合并多余空格 */
function cleanOneLine(line){
  return line
    .replace(/^\s*\d+\s*[.．、]\s*/, '')  // 行首序号 1. 39. 全角．顿号、
    .replace(/[:：]+/g, ' ')             // 中英文冒号换成空格
    .replace(/[ \t]{2,}/g, ' ')
    .trim();
}
/* 整段转「每行一个」清单格式（去空行、去代码块围栏） */
function toListFormat(text){
  return String(text)
    .replace(/```[a-z]*\s*/gi, '').replace(/```/g, '')
    .split(/\r?\n/)
    .map(cleanOneLine)
    .filter(s => s.length > 0)
    .join('\n');
}

/* ---------- Tab 切换 ---------- */
function switchTab(t){
  const isText = t==='text';
  document.getElementById('tabText').classList.toggle('hidden', !isText);
  document.getElementById('tabImg').classList.toggle('hidden', isText);
  document.getElementById('tabTextBtn').classList.toggle('active', isText);
  document.getElementById('tabImgBtn').classList.toggle('active', !isText);
}

/* ---------- 文本整理 ---------- */
function cleanText(){
  const raw = document.getElementById('rawText').value;
  const out = raw.split(/\r?\n/).map(cleanOneLine);
  document.getElementById('outText').value = out.join('\n');
  toast('整理完成');
}
function resetText(){ document.getElementById('rawText').value = SAMPLE; toast('已恢复示例'); }

/* ---------- 图片识别：输出格式切换 ---------- */
function onFmtChange(){
  document.getElementById('prompt').value = PROMPTS[document.getElementById('outFmt').value];
}
function resetPrompt(){
  document.getElementById('prompt').value = PROMPTS[document.getElementById('outFmt').value];
  toast('已恢复默认要求');
}

/* ---------- 复制 ---------- */
function copyEl(id){
  const el = document.getElementById(id);
  if(!el.value.trim()){ toast('没有可复制的内容'); return; }
  navigator.clipboard.writeText(el.value).then(()=>toast('已复制到剪贴板'))
   .catch(()=>{ el.select(); document.execCommand('copy'); toast('已复制'); });
}
function sendToText(){
  const v = document.getElementById('recOut').value;
  if(!v.trim()){ toast('没有识别结果'); return; }
  document.getElementById('rawText').value = v;
  switchTab('text');
  toast('已发送到文本整理');
}

/* ---------- API 配置存储 ---------- */
const LS = 'vegAdmin_api';
function loadApi(){
  try{
    const d = JSON.parse(localStorage.getItem(LS)||'{}');
    if(d.baseUrl) document.getElementById('baseUrl').value = d.baseUrl;
    if(d.apiKey) document.getElementById('apiKey').value = d.apiKey;
    if(d.model){
      const sel = document.getElementById('modelSel');
      sel.innerHTML = `<option value="${d.model}">${d.model}</option>`;
      sel.value = d.model;
    }
    if(d.fmt) document.getElementById('apiFmt').value = d.fmt;
    updateApiTag(d);
  }catch(e){}
}
function currentApi(){
  return {
    baseUrl: document.getElementById('baseUrl').value.trim(),
    apiKey: document.getElementById('apiKey').value.trim(),
    model: document.getElementById('modelSel').value,
    fmt: document.getElementById('apiFmt').value
  };
}
function saveApi(){
  const d = currentApi();
  if(!d.baseUrl || !d.apiKey){ setStatus('apiStatus','请先填写接口地址和密钥','err'); return; }
  localStorage.setItem(LS, JSON.stringify(d));
  updateApiTag(d);
  setStatus('apiStatus','✅ 已保存','ok');
  toast('配置已保存');
}
function updateApiTag(d){
  const tag = document.getElementById('apiTag');
  if(d.baseUrl && d.apiKey && d.model){ tag.textContent='已就绪'; tag.style.color='var(--green)'; }
  else if(d.baseUrl && d.apiKey){ tag.textContent='待选模型'; tag.style.color='var(--text-2)'; }
  else { tag.textContent='未配置'; tag.style.color='var(--text-2)'; }
}
function togglePw(){
  const i = document.getElementById('apiKey');
  const b = event.target;
  if(i.type==='password'){ i.type='text'; b.textContent='隐藏'; } else { i.type='password'; b.textContent='显示'; }
}
function toggleApi(e){
  const det = document.getElementById('apiDetails');
  const head = document.getElementById('apiHead');
  e.preventDefault();
  det.open = !det.open;
  head.classList.toggle('open', det.open);
}

/* ---------- URL 归一化 ---------- */
function normBase(base){
  base = base.trim().replace(/\/+$/,'');
  base = base.replace(/\/chat\/completions$/,'').replace(/\/messages$/,'').replace(/\/models$/,'');
  if(/\/v\d+$/.test(base)) return base;      // 已含 /v1
  return base + '/v1';
}

/* ---------- 对话调用（自动兼容 OpenAI / Anthropic 两种格式）---------- */
function apiError(status, body){
  const e = new Error('HTTP '+status+(body?'：'+String(body).slice(0,180):''));
  e.status = status; return e;
}
function dataUrlParts(url){
  // data:image/png;base64,XXXX -> {mediaType, base64}
  const m = /^data:([^;]+);base64,(.*)$/.exec(url||'');
  return m ? { mediaType:m[1], base64:m[2] } : { mediaType:'image/jpeg', base64:(url||'').split(',').pop() };
}
// OpenAI 格式：POST /v1/chat/completions
async function chatOpenAI(base, key, model, prompt, imageDataUrl){
  const content = imageDataUrl
    ? [{type:'text', text:prompt}, {type:'image_url', image_url:{url:imageDataUrl}}]
    : prompt;
  const res = await fetch(base+'/chat/completions', {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
    body:JSON.stringify({ model, messages:[{role:'user', content}], temperature:0 })
  });
  if(!res.ok) throw apiError(res.status, await res.text());
  const data = await res.json();
  const t = data.choices?.[0]?.message?.content;
  return typeof t==='string' ? t : (t!=null ? JSON.stringify(t) : JSON.stringify(data));
}
// Anthropic / Claude 格式：POST /v1/messages
async function chatAnthropic(base, key, model, prompt, imageDataUrl){
  let content;
  if(imageDataUrl){
    const {mediaType, base64} = dataUrlParts(imageDataUrl);
    content = [
      {type:'text', text:prompt},
      {type:'image', source:{type:'base64', media_type:mediaType, data:base64}}
    ];
  } else { content = prompt; }
  const res = await fetch(base+'/messages', {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key':key,
      'Authorization':'Bearer '+key,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body:JSON.stringify({ model, max_tokens:2048, messages:[{role:'user', content}] })
  });
  if(!res.ok) throw apiError(res.status, await res.text());
  const data = await res.json();
  const t = (data.content||[]).map(c=>c.text||'').join('');
  return t || JSON.stringify(data);
}
// 按所选格式调用；auto 模式下 OpenAI 端点 404/405 时自动改用 Anthropic
async function smartChat(prompt, imageDataUrl){
  const {baseUrl, apiKey, model, fmt} = currentApi();
  const base = normBase(baseUrl);
  const order = fmt==='anthropic' ? ['anthropic']
              : fmt==='openai'    ? ['openai']
              : ['openai','anthropic'];
  let lastErr;
  for(let i=0;i<order.length;i++){
    const f = order[i];
    try{
      return f==='openai'
        ? await chatOpenAI(base, apiKey, model, prompt, imageDataUrl)
        : await chatAnthropic(base, apiKey, model, prompt, imageDataUrl);
    }catch(e){
      lastErr = e;
      // 仅当端点不存在（404/405）且还有备选格式时，才自动切换
      if(i < order.length-1 && (e.status===404 || e.status===405)) continue;
      throw e;
    }
  }
  throw lastErr;
}

/* ---------- 获取模型 ---------- */
async function fetchModels(){
  const {baseUrl, apiKey} = currentApi();
  if(!baseUrl || !apiKey){ setStatus('apiStatus','请先填写接口地址和密钥','err'); return; }
  const btn = document.getElementById('fetchBtn');
  btn.disabled = true; btn.textContent = '获取中…';
  setStatus('apiStatus','正在获取模型列表…','info');
  try{
    const url = normBase(baseUrl) + '/models';
    const res = await fetch(url, { headers:{ 'Authorization':'Bearer '+apiKey } });
    if(!res.ok){ throw new Error('HTTP '+res.status+' '+(await res.text()).slice(0,160)); }
    const data = await res.json();
    let list = (data.data||data.models||data||[]).map(m=> typeof m==='string'? m : (m.id||m.model||m.name)).filter(Boolean);
    // 视觉模型优先排序
    list.sort((a,b)=> vScore(b)-vScore(a) || a.localeCompare(b));
    if(!list.length){ throw new Error('返回列表为空'); }
    const sel = document.getElementById('modelSel');
    const prev = sel.value;
    sel.innerHTML = list.map(m=>`<option value="${m}">${m}</option>`).join('');
    if(list.includes(prev)) sel.value = prev;
    setStatus('apiStatus', `✅ 获取到 ${list.length} 个模型，已按视觉模型优先排序`, 'ok');
    updateApiTag(currentApi());
  }catch(err){
    setStatus('apiStatus','❌ 获取失败：'+err.message+'（若为跨域限制，请确认中转站已开启 CORS）','err');
  }finally{
    btn.disabled=false; btn.textContent='🔄 获取模型';
  }
}
function vScore(name){
  const n = (name||'').toLowerCase();
  let s=0;
  ['gpt-4o','gpt-4.1','vision','vl','vision','claude','gemini','qwen-vl','glm-4v','4v','o1','o3','o4'].forEach(k=>{ if(n.includes(k)) s+=2; });
  if(n.includes('mini')||n.includes('nano')) s-=1;
  return s;
}

/* ---------- 测试连通性 ---------- */
async function testApi(){
  const {baseUrl, apiKey, model} = currentApi();
  if(!baseUrl || !apiKey){ setStatus('apiStatus','请先填写接口地址和密钥','err'); return; }
  const btn = document.getElementById('testBtn');
  btn.disabled=true; btn.textContent='测试中…';
  setStatus('apiStatus','正在测试连接…','info');
  try{
    // 先测 /models 通路
    const mres = await fetch(normBase(baseUrl)+'/models',{headers:{'Authorization':'Bearer '+apiKey,'x-api-key':apiKey}});
    if(!mres.ok) throw new Error('接口返回 HTTP '+mres.status);
    // 若已选模型，再发一条极短对话验证 key 与格式（自动兼容 OpenAI / Anthropic）
    if(model){
      await smartChat('hi', null);
      setStatus('apiStatus','✅ 连接成功，模型「'+model+'」可用','ok');
    }else{
      setStatus('apiStatus','✅ 地址与密钥可用，请点「获取模型」选择一个模型','ok');
    }
    toast('连接成功');
  }catch(err){
    setStatus('apiStatus','❌ 连接失败：'+err.message,'err');
  }finally{
    btn.disabled=false; btn.textContent='📡 测试连通性';
  }
}

function setStatus(id,msg,type){
  const el = document.getElementById(id);
  el.textContent = msg;
  el.className = 'status '+(type||'info');
}

/* ---------- 图片处理 ---------- */
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
dropZone.addEventListener('click', ()=>fileInput.click());
fileInput.addEventListener('change', e=>{ if(e.target.files[0]) loadImg(e.target.files[0]); });
['dragenter','dragover'].forEach(ev=>dropZone.addEventListener(ev, e=>{ e.preventDefault(); dropZone.classList.add('hover'); }));
['dragleave','drop'].forEach(ev=>dropZone.addEventListener(ev, e=>{ e.preventDefault(); dropZone.classList.remove('hover'); }));
dropZone.addEventListener('drop', e=>{ const f=e.dataTransfer.files[0]; if(f) loadImg(f); });
window.addEventListener('paste', e=>{
  if(document.getElementById('tabImg').classList.contains('hidden')) return;
  for(const it of e.clipboardData.items){ if(it.type.indexOf('image')===0){ loadImg(it.getAsFile()); e.preventDefault(); } }
});
function loadImg(file){
  if(!file.type.startsWith('image/')){ toast('请选择图片文件'); return; }
  const r = new FileReader();
  r.onload = ev=>{
    imageDataUrl = ev.target.result;
    document.getElementById('previewImg').src = imageDataUrl;
    document.getElementById('preview').style.display='block';
    dropZone.style.display='none';
  };
  r.readAsDataURL(file);
}
function clearImg(){
  imageDataUrl=null; fileInput.value='';
  document.getElementById('preview').style.display='none';
  dropZone.style.display='block';
}

/* ---------- 识别 ---------- */
async function recognize(){
  const {baseUrl, apiKey, model} = currentApi();
  if(!baseUrl || !apiKey){ setStatus('recStatus','请先在上方配置中转站 API','err'); document.getElementById('apiDetails').open=true; document.getElementById('apiHead').classList.add('open'); return; }
  if(!model){ setStatus('recStatus','请先获取并选择一个模型','err'); return; }
  if(!imageDataUrl){ setStatus('recStatus','请先上传图片','err'); return; }
  const fmt = document.getElementById('outFmt').value;
  const prompt = document.getElementById('prompt').value.trim() || PROMPTS[fmt];
  const btn = document.getElementById('recBtn');
  btn.disabled=true; btn.innerHTML='<span class="spin"></span> 识别中…';
  setStatus('recStatus','正在识别，请稍候…','info');
  try{
    let text = await smartChat(prompt, imageDataUrl);
    text = (typeof text==='string' ? text : JSON.stringify(text)).trim();
    // 清单格式：识别后自动换行转换，去编号去冒号
    if(fmt === 'list') text = toListFormat(text);
    document.getElementById('recOut').value = text;
    setStatus('recStatus','✅ 识别完成'+(fmt==='list'?'（已自动整理成清单）':''),'ok');
    toast('识别完成');
  }catch(err){
    setStatus('recStatus','❌ 识别失败：'+err.message,'err');
  }finally{
    btn.disabled=false; btn.innerHTML='🔍 开始识别';
  }
}

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1600);
}

/* 启动 */
loadApi();
