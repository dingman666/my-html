<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金额计算工具</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 24px 20px 60px;
    color: #fff;
  }

  .container {
    width: 100%;
    max-width: 480px;
  }

  /* ===== 标题 ===== */
  .title {
    text-align: center;
    margin-bottom: 28px;
  }
  .title h1 {
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(90deg, #f7971e, #ffd200);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 2px;
  }
  .title p {
    font-size: 13px;
    color: rgba(255,255,255,.45);
    margin-top: 6px;
  }

  /* ===== 主卡片 ===== */
  .card {
    background: rgba(255,255,255,.06);
    backdrop-filter: blur(18px);
    border-radius: 20px;
    padding: 28px 24px 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,.35);
    border: 1px solid rgba(255,255,255,.08);
  }

  /* ===== 输入区 ===== */
  .input-group {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .input-group label {
    font-size: 14px;
    color: rgba(255,255,255,.6);
    white-space: nowrap;
    min-width: 40px;
  }

  .input-group input[type="number"] {
    flex: 1;
    min-width: 110px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 20px;
    color: #fff;
    outline: none;
    transition: border .2s, box-shadow .2s;
    -moz-appearance: textfield;
    appearance: textfield;
  }
  .input-group input[type="number"]:focus {
    border-color: #ffd200;
    box-shadow: 0 0 12px rgba(255,210,0,.25);
  }
  .input-group input[type="number"]::-webkit-inner-spin-button,
  .input-group input[type="number"]::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  .input-group select {
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 18px;
    color: #ffd200;
    font-weight: 700;
    outline: none;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }
  .input-group select option { background: #24243e; color: #ffd200; }

  .operator-select {
    min-width: 56px;
    text-align: center;
  }

  .num-input {
    flex: 1;
    min-width: 90px;
    text-align: center;
    font-size: 18px !important;
    padding: 10px 8px !important;
  }

  /* ===== 计算步骤行 ===== */
  .step-row {
    position: relative;
    animation: fadeIn .25s;
  }
  .step-row .remove-step {
    background: rgba(255,60,60,.12);
    border: 1px solid rgba(255,60,60,.28);
    color: #ff6b6b;
    width: 38px;
    height: 42px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    flex: none;
    transition: background .2s;
  }
  .step-row .remove-step:hover { background: rgba(255,60,60,.25); }

  .step-row .pct-toggle {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    flex: none;
    cursor: pointer;
    font-size: 16px;
    font-weight: 700;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.15);
    color: rgba(255,255,255,.5);
    transition: all .2s;
  }
  .step-row .pct-toggle:hover { border-color: rgba(255,210,0,.4); color: #ffd200; }
  .step-row .pct-toggle.active {
    background: linear-gradient(135deg, #f7971e, #ffd200);
    border-color: transparent;
    color: #302b63;
  }

  .add-step-btn {
    width: 100%;
    padding: 11px 0;
    background: rgba(255,255,255,.05);
    border: 1px dashed rgba(255,255,255,.2);
    border-radius: 12px;
    color: rgba(255,255,255,.6);
    font-size: 14px;
    cursor: pointer;
    margin-bottom: 16px;
    transition: background .2s, border-color .2s, color .2s;
  }
  .add-step-btn:hover:not(:disabled) {
    background: rgba(255,255,255,.09);
    border-color: rgba(255,210,0,.4);
    color: #ffd200;
  }
  .add-step-btn:disabled { opacity: .35; cursor: not-allowed; }

  /* ===== 选项栏 ===== */
  .options-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 16px;
  }
  .opt-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
  }
  .opt-toggle .switch {
    width: 38px; height: 21px;
    background: rgba(255,255,255,.15);
    border-radius: 11px;
    position: relative;
    transition: background .25s;
    flex: none;
  }
  .opt-toggle .switch::after {
    content: '';
    position: absolute;
    width: 15px; height: 15px;
    border-radius: 50%;
    background: #fff;
    top: 3px; left: 3px;
    transition: transform .25s;
  }
  .opt-toggle.active .switch { background: #ffd200; }
  .opt-toggle.active .switch::after { transform: translateX(17px); }
  .opt-toggle span { font-size: 13px; color: rgba(255,255,255,.55); }

  /* ===== 结果区 ===== */
  .result-area {
    background: rgba(0,0,0,.25);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 18px;
    min-height: 90px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .result-area .expression {
    font-size: 15px;
    color: rgba(255,255,255,.5);
    word-break: break-all;
    margin-bottom: 8px;
    min-height: 22px;
    line-height: 1.5;
  }

  .result-area .result {
    font-size: 36px;
    font-weight: 800;
    color: #ffd200;
    word-break: break-all;
    letter-spacing: 1px;
  }

  .result-area .result.error { font-size: 20px; color: #ff6b6b; }

  .result-area .placeholder {
    font-size: 16px;
    color: rgba(255,255,255,.25);
    font-weight: 400;
  }

  .result-area .upper {
    font-size: 13px;
    color: rgba(255,255,255,.4);
    margin-top: 10px;
    word-break: break-all;
  }

  /* ===== 按钮 ===== */
  .btn-row {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
  }

  .btn {
    flex: 1;
    padding: 14px 0;
    border: none;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .15s, box-shadow .2s, opacity .2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    user-select: none;
  }
  .btn:active { transform: scale(.96); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  .btn-primary {
    background: linear-gradient(135deg, #f7971e, #ffd200);
    color: #302b63;
    box-shadow: 0 4px 15px rgba(255,210,0,.3);
  }
  .btn-primary:hover:not(:disabled) { box-shadow: 0 6px 22px rgba(255,210,0,.45); }

  .btn-danger {
    background: rgba(255,60,60,.15);
    border: 1px solid rgba(255,60,60,.3);
    color: #ff6b6b;
  }
  .btn-danger:hover:not(:disabled) { background: rgba(255,60,60,.25); }

  .btn-copy {
    background: linear-gradient(135deg, #11998e, #38ef7d);
    color: #fff;
    box-shadow: 0 4px 15px rgba(56,239,125,.25);
  }
  .btn-copy:hover:not(:disabled) { box-shadow: 0 6px 22px rgba(56,239,125,.4); }
  .btn-copy.copied { background: linear-gradient(135deg, #56ab2f, #a8e063); pointer-events: none; }

  .btn-icon { font-size: 20px; line-height: 1; }
  .btn-text { font-size: 15px; }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(.85);
    background: rgba(0,0,0,.8);
    backdrop-filter: blur(10px);
    padding: 14px 32px;
    border-radius: 12px;
    font-size: 15px;
    color: #fff;
    opacity: 0;
    transition: opacity .25s, transform .25s;
    z-index: 999;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  /* ===== 历史记录 ===== */
  .history-section { margin-top: 24px; }
  .history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .history-header h3 {
    font-size: 15px;
    color: rgba(255,255,255,.5);
    font-weight: 500;
  }
  .history-header .clear-btn {
    font-size: 12px;
    cursor: pointer;
    background: none;
    border: none;
    color: rgba(255,255,255,.35);
    padding: 4px 8px;
    border-radius: 6px;
    transition: background .2s;
  }
  .history-header .clear-btn:hover { background: rgba(255,255,255,.08); }

  .history-list {
    list-style: none;
    max-height: 240px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,.15) transparent;
  }
  .history-list::-webkit-scrollbar { width: 4px; }
  .history-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }

  .history-list li {
    padding: 10px 14px;
    border-radius: 10px;
    margin-bottom: 6px;
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.05);
    cursor: pointer;
    transition: background .2s, border .2s;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .history-list li:hover {
    background: rgba(255,255,255,.08);
    border-color: rgba(255,255,255,.15);
  }
  .history-list li .expr {
    font-size: 13px;
    color: rgba(255,255,255,.7);
    word-break: break-all;
  }
  .history-list li .val {
    font-size: 16px;
    font-weight: 700;
    color: #ffd200;
    white-space: nowrap;
  }
  .empty-tip {
    text-align: center;
    padding: 16px;
    color: rgba(255,255,255,.2);
    font-size: 13px;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .hint {
    font-size: 12px;
    color: rgba(255,255,255,.3);
    text-align: center;
    margin-top: 14px;
    line-height: 1.6;
  }

  /* ===== 粘贴检查 ===== */
  .check-card { margin-top: 22px; }
  .check-title {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .check-title .ct-main { font-size: 17px; font-weight: 700; color: #fff; }
  .check-title .ct-sub  { font-size: 12px; color: rgba(255,255,255,.4); }

  .paste-input {
    width: 100%;
    min-height: 120px;
    resize: vertical;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 15px;
    color: #fff;
    outline: none;
    line-height: 1.7;
    font-family: 'SF Mono', 'Consolas', 'Menlo', monospace;
    margin-bottom: 14px;
    transition: border .2s, box-shadow .2s;
  }
  .paste-input:focus { border-color: #ffd200; box-shadow: 0 0 12px rgba(255,210,0,.25); }
  .paste-input::placeholder { color: rgba(255,255,255,.28); }

  .check-result { margin-top: 6px; }
  .check-summary {
    font-size: 14px;
    margin-bottom: 12px;
    color: rgba(255,255,255,.75);
    font-weight: 600;
  }
  .check-summary .ok-c  { color: #56eb9a; }
  .check-summary .bad-c { color: #ff6b6b; }
  .check-line {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    margin-bottom: 8px;
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.06);
    font-size: 14px;
    line-height: 1.5;
    animation: fadeIn .2s;
  }
  .check-line .ico { font-size: 16px; flex: none; line-height: 1.45; }
  .check-line .body { flex: 1; word-break: break-all; }
  .check-line .expr-txt { color: rgba(255,255,255,.9); }
  .check-line .note { display: block; margin-top: 4px; font-size: 13px; color: rgba(255,255,255,.6); }
  .check-line.ok   { border-color: rgba(56,239,125,.30); background: rgba(56,239,125,.06); }
  .check-line.ok .note   { color: #8ef0b0; }
  .check-line.bad  { border-color: rgba(255,107,107,.35); background: rgba(255,107,107,.07); }
  .check-line.bad .note  { color: #ff9b9b; }
  .check-line.warn { border-color: rgba(255,210,0,.30); background: rgba(255,210,0,.06); }
  .check-line.warn .note { color: #ffe08a; }
  .check-line .right { color: #ffd200; font-weight: 700; }
</style>
  <link rel="icon" href="./icon.png">
</head>
<body>

<div class="container">
  <!-- 标题 -->
  <div class="title">
    <h1>💰 金额计算工具</h1>
    <p>支持多步连续计算 · 一键复制完整过程</p>
  </div>

  <!-- 主卡片 -->
  <div class="card">
    <!-- 金额输入 -->
    <div class="input-group">
      <label>金额</label>
      <input type="number" id="amount" placeholder="请输入金额" step="any" autofocus>
    </div>

    <!-- 运算步骤容器（动态生成） -->
    <div id="stepsContainer"></div>

    <!-- 添加步骤 -->
    <button class="add-step-btn" id="addStepBtn">＋ 添加一步运算</button>

    <!-- 选项 -->
    <div class="options-bar">
      <div class="opt-toggle active" id="roundToggle" title="结果保留两位小数（金额常用）">
        <div class="switch"></div>
        <span>保留两位小数</span>
      </div>
      <div class="opt-toggle" id="liveToggle" title="输入时自动计算">
        <div class="switch"></div>
        <span>实时计算</span>
      </div>
    </div>

    <!-- 结果区 -->
    <div class="result-area">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">
        <span class="placeholder">结果将在此显示</span>
      </div>
      <div class="upper" id="upperResult"></div>
    </div>

    <!-- 按钮 -->
    <div class="btn-row">
      <button class="btn btn-primary" id="calcBtn" disabled>
        <span class="btn-icon">⚡</span>
        <span class="btn-text">计算</span>
      </button>
      <button class="btn btn-copy" id="copyBtn" disabled>
        <span class="btn-icon">📋</span>
        <span class="btn-text">复制</span>
      </button>
    </div>
    <div class="btn-row">
      <button class="btn btn-danger" id="resetBtn">
        <span class="btn-icon">🔄</span>
        <span class="btn-text">重置</span>
      </button>
    </div>

    <div class="hint">按 <b>Enter</b> 计算 · 多步运算从左到右依次进行<br>点亮 <b>%</b> 可按百分比算：×85%=打八五折，+10%=加一成</div>
  </div>

  <!-- 粘贴检查 -->
  <div class="card check-card">
    <div class="check-title">
      <span class="ct-main">🔍 粘贴检查</span>
      <span class="ct-sub">把算式粘进来，自动判断对错</span>
    </div>
    <textarea id="pasteInput" class="paste-input" placeholder="粘贴算式，每行一条，例如：&#10;100 × 0.5 + 20 = 70&#10;1200 ÷ 3 = 400&#10;800 × 85% = 680&#10;(100 + 20) × 3 = 360"></textarea>
    <div class="btn-row">
      <button class="btn btn-primary" id="checkBtn">
        <span class="btn-icon">🔍</span>
        <span class="btn-text">检查</span>
      </button>
      <button class="btn btn-danger" id="clearPasteBtn">
        <span class="btn-icon">🧹</span>
        <span class="btn-text">清空</span>
      </button>
    </div>
    <div class="check-result" id="checkResult"></div>
    <div class="hint">按标准运算顺序判断（先 × ÷，后 + −）· 支持括号、% 和千分位逗号<br>每行一条，可写 <b>算式 = 答案</b> 判断对错，或只写 <b>算式</b> 直接算出结果 · <b>Ctrl/⌘ + Enter</b> 检查</div>
  </div>

  <!-- 历史记录 -->
  <div class="history-section">
    <div class="history-header">
      <h3>📜 计算历史</h3>
      <button class="clear-btn" id="clearHistory">清空</button>
    </div>
    <ul class="history-list" id="historyList">
      <li class="empty-tip">暂无记录</li>
    </ul>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  const $ = id => document.getElementById(id);

  const amountInput   = $('amount');
  const stepsContainer= $('stepsContainer');
  const addStepBtn    = $('addStepBtn');
  const roundToggle   = $('roundToggle');
  const liveToggle    = $('liveToggle');
  const calcBtn       = $('calcBtn');
  const copyBtn       = $('copyBtn');
  const resetBtn      = $('resetBtn');
  const resultEl      = $('result');
  const exprEl        = $('expression');
  const upperEl       = $('upperResult');
  const historyList   = $('historyList');
  const toastEl       = $('toast');
  const pasteInput    = $('pasteInput');
  const checkBtn      = $('checkBtn');
  const clearPasteBtn = $('clearPasteBtn');
  const checkResult   = $('checkResult');

  const opMap = { '*': '×', '+': '+', '-': '−', '/': '÷' };

  let history = JSON.parse(localStorage.getItem('calcHistory') || '[]');
  let lastResult = null;
  let lastText = '';
  let roundMode = localStorage.getItem('calcRound') !== '0';   // 默认开
  let liveMode  = localStorage.getItem('calcLive') === '1';

  if (roundMode) roundToggle.classList.add('active'); else roundToggle.classList.remove('active');
  if (liveMode)  liveToggle.classList.add('active');

  // ===== 生成一行运算步骤 =====
  function makeStepRow(op = '*', val = '', pct = false) {
    const row = document.createElement('div');
    row.className = 'input-group step-row';
    row.innerHTML = `
      <label>运算</label>
      <select class="operator-select op-select">
        <option value="*">×</option>
        <option value="+">+</option>
        <option value="-">−</option>
        <option value="/">÷</option>
      </select>
      <input type="number" class="num-input val-input" step="any" placeholder="数值">
      <button class="pct-toggle" title="按百分比计算（如 ×85% / +10%）">%</button>
      <button class="remove-step" title="删除此步">✕</button>
    `;
    row.querySelector('.op-select').value = op;
    row.querySelector('.val-input').value = val;
    const pctBtn = row.querySelector('.pct-toggle');
    pctBtn.classList.toggle('active', pct);
    row.querySelector('.op-select').addEventListener('change', onInput);
    row.querySelector('.val-input').addEventListener('input', onInput);
    pctBtn.addEventListener('click', () => {
      pctBtn.classList.toggle('active');
      onInput();
    });
    row.querySelector('.remove-step').addEventListener('click', () => {
      row.remove();
      updateAddBtn();
      onInput();
    });
    return row;
  }

  function addStep(op, val, pct) {
    const row = makeStepRow(op, val, pct);
    stepsContainer.appendChild(row);
    updateAddBtn();
    row.querySelector('.val-input').focus();
    onInput();
  }

  function updateAddBtn() {
    const n = stepsContainer.children.length;
    addStepBtn.textContent = n > 0
      ? `＋ 添加一步运算（已 ${n} 步）`
      : '＋ 添加一步运算';
  }

  addStepBtn.addEventListener('click', () => addStep('*', ''));

  // ===== 读取所有步骤 =====
  function getSteps() {
    return [...stepsContainer.children].map(row => ({
      op:  row.querySelector('.op-select').value,
      val: row.querySelector('.val-input').value,
      pct: row.querySelector('.pct-toggle').classList.contains('active')
    }));
  }

  // ===== 校验输入并控制按钮 =====
  function validate() {
    const amountOk = amountInput.value !== '' && !isNaN(Number(amountInput.value));
    const steps = getSteps();
    const stepsOk = steps.every(s => s.val !== '' && !isNaN(Number(s.val)));
    const ok = amountOk && stepsOk;
    calcBtn.disabled = !ok;
    return ok;
  }

  function onInput() {
    const ok = validate();
    if (liveMode && ok) calc(true);
    else if (liveMode && !ok) clearResult();
  }

  amountInput.addEventListener('input', onInput);

  // 回车计算（粘贴框内回车用于换行，不触发主计算）
  document.addEventListener('keydown', e => {
    if (e.target && e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'Enter' && !calcBtn.disabled) calc();
  });

  // ===== 数字格式化（千分位） =====
  function format(n) {
    if (!isFinite(n)) return String(n);
    const s = roundMode ? n.toFixed(2) : trimFloat(n);
    const parts = s.split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return parts.join('.');
  }
  // 去掉浮点误差尾巴
  function trimFloat(n) {
    return parseFloat(n.toPrecision(12)).toString();
  }

  // ===== 计算 =====
  function calc(silent = false) {
    if (!validate()) return;

    const a = Number(amountInput.value);
    const steps = getSteps();

    let r = a;
    let exprParts = [trimFloat(a)];
    let divByZero = false;

    for (const s of steps) {
      const b = Number(s.val);
      if (s.pct) {
        // 百分比语义：+/− 为在当前结果上增减百分比，×/÷ 为乘/除以该比例
        switch (s.op) {
          case '*': r = r * (b / 100); break;
          case '+': r = r * (1 + b / 100); break;
          case '-': r = r * (1 - b / 100); break;
          case '/':
            if (b === 0) { divByZero = true; }
            else r = r / (b / 100);
            break;
        }
        exprParts.push(opMap[s.op], trimFloat(b) + '%');
      } else {
        switch (s.op) {
          case '*': r = r * b; break;
          case '+': r = r + b; break;
          case '-': r = r - b; break;
          case '/':
            if (b === 0) { divByZero = true; }
            else r = r / b;
            break;
        }
        exprParts.push(opMap[s.op], trimFloat(b));
      }
      if (divByZero) break;
    }

    if (divByZero || !isFinite(r)) {
      resultEl.className = 'result error';
      resultEl.textContent = '⚠️ 计算错误（除数不能为 0）';
      exprEl.textContent = '';
      upperEl.textContent = '';
      copyBtn.disabled = true;
      lastResult = null;
      return;
    }

    const expr = exprParts.join(' ');
    const formatted = format(r);

    resultEl.className = 'result';
    resultEl.textContent = formatted;
    exprEl.textContent = `${expr} =`;

    // 金额大写（仅整数/两位小数且金额合理时显示）
    const upper = toChineseMoney(roundMode ? Number(r.toFixed(2)) : r);
    upperEl.textContent = upper ? `大写：${upper}` : '';

    lastResult = roundMode ? Number(r.toFixed(2)) : r;
    lastText = `${expr} = ${lastResult}`;
    copyBtn.disabled = false;

    if (!silent) saveHistory(expr, lastResult, formatted);
  }

  function clearResult() {
    resultEl.className = 'result';
    resultEl.innerHTML = '<span class="placeholder">结果将在此显示</span>';
    exprEl.textContent = '';
    upperEl.textContent = '';
    copyBtn.disabled = true;
    lastResult = null;
  }

  calcBtn.addEventListener('click', () => calc());

  // ===== 选项开关 =====
  roundToggle.addEventListener('click', () => {
    roundMode = !roundMode;
    roundToggle.classList.toggle('active', roundMode);
    localStorage.setItem('calcRound', roundMode ? '1' : '0');
    if (lastResult !== null || validate()) calc(true);
  });
  liveToggle.addEventListener('click', () => {
    liveMode = !liveMode;
    liveToggle.classList.toggle('active', liveMode);
    localStorage.setItem('calcLive', liveMode ? '1' : '0');
    if (liveMode) onInput();
  });

  // ===== 复制 =====
  copyBtn.addEventListener('click', () => {
    if (lastResult === null) return;
    navigator.clipboard.writeText(lastText).then(() => {
      copyBtn.classList.add('copied');
      copyBtn.innerHTML = '<span class="btn-icon">✅</span><span class="btn-text">已复制</span>';
      showToast('已复制：' + lastText);
      setTimeout(() => {
        copyBtn.classList.remove('copied');
        copyBtn.innerHTML = '<span class="btn-icon">📋</span><span class="btn-text">复制</span>';
      }, 1500);
    }).catch(() => showToast('复制失败，请手动复制'));
  });

  // ===== 重置 =====
  resetBtn.addEventListener('click', () => {
    amountInput.value = '';
    stepsContainer.innerHTML = '';
    addStep('*', '0.5');         // 默认一步
    clearResult();
    calcBtn.disabled = true;
    lastText = '';
    amountInput.focus();
  });

  // ===== Toast =====
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 1600);
  }

  // ===== 历史记录 =====
  function saveHistory(expr, result, formatted) {
    history.unshift({ expr, result, formatted });
    if (history.length > 200) history.pop();
    localStorage.setItem('calcHistory', JSON.stringify(history));
    renderHistory();
  }

  function renderHistory() {
    if (history.length === 0) {
      historyList.innerHTML = '<li class="empty-tip">暂无记录</li>';
      return;
    }
    historyList.innerHTML = history.map((h, i) =>
      `<li data-index="${i}" title="点击复制">
         <span class="expr">${h.expr} =</span>
         <span class="val">${h.formatted}</span>
       </li>`
    ).join('');
    historyList.querySelectorAll('li').forEach(li => {
      li.addEventListener('click', () => {
        const h = history[li.dataset.index];
        navigator.clipboard.writeText(`${h.expr} = ${h.result}`)
          .then(() => showToast('已复制该记录'))
          .catch(() => showToast('复制失败'));
      });
    });
  }

  $('clearHistory').addEventListener('click', () => {
    if (history.length === 0) return;
    history = [];
    localStorage.removeItem('calcHistory');
    renderHistory();
    showToast('历史已清空');
  });

  // ===== 金额转中文大写（按四位分节） =====
  function toChineseMoney(num) {
    if (!isFinite(num) || num < 0) return '';
    if (Math.abs(num) >= 1e13) return '';   // 太大不转
    const digits = ['零','壹','贰','叁','肆','伍','陆','柒','捌','玖'];
    const smallUnit = ['','拾','佰','仟'];
    const bigUnit = ['','万','亿','万亿'];

    let n = Math.round(num * 100); // 转成分
    if (n === 0) return '零元整';
    let intPart = Math.floor(n / 100);
    const decPart = n % 100;

    // 把 0-9999 转成中文
    function fourToCN(sec) {
      let s = '', zero = false;
      const str = String(sec);
      for (let i = 0; i < str.length; i++) {
        const d = +str[i];
        const pos = str.length - 1 - i;
        if (d === 0) { zero = true; }
        else {
          if (zero) { s += '零'; zero = false; }
          s += digits[d] + smallUnit[pos];
        }
      }
      return s;
    }

    let intStr = '';
    if (intPart > 0) {
      const sections = [];
      while (intPart > 0) { sections.push(intPart % 10000); intPart = Math.floor(intPart / 10000); }
      for (let i = sections.length - 1; i >= 0; i--) {
        const sec = sections[i];
        if (sec === 0) continue;
        if (intStr && sec < 1000) intStr += '零';
        intStr += fourToCN(sec) + bigUnit[i];
      }
      intStr += '元';
    }

    let str = intStr;
    if (decPart === 0) {
      str += '整';
    } else {
      const jiao = Math.floor(decPart / 10);
      const fen = decPart % 10;
      if (jiao > 0) str += digits[jiao] + '角';
      else if (intStr) str += '零';
      if (fen > 0) str += digits[fen] + '分';
    }
    return str;
  }

  // ===== 粘贴检查 =====
  function esc(s) {
    return String(s).replace(/[&<>"]/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  // 过滤复制带来的隐藏字符：控制字符、零宽空格、方向控制、BOM 等
  function stripInvisible(s) {
    let out = '';
    for (const ch of String(s)) {
      const c = ch.codePointAt(0);
      if (c < 0x20 || c === 0x7f) continue;            // 控制字符 / DEL
      if (c === 0xa0 || c === 0xad) continue;          // 不间断空格 / 软连字符
      if (c === 0x061c) continue;                      // 阿拉伯字母标记
      if (c >= 0x200b && c <= 0x200f) continue;        // 零宽空格 / LRM / RLM
      if (c >= 0x202a && c <= 0x202e) continue;        // 方向控制
      if (c >= 0x2060 && c <= 0x2064) continue;        // word joiner 等
      if (c >= 0x2066 && c <= 0x2069) continue;        // 方向隔离
      if (c === 0x2028 || c === 0x2029) continue;      // 行 / 段分隔符
      if (c === 0xfeff || c === 0xfffc) continue;      // BOM / 对象替换符
      out += ch;
    }
    return out;
  }

  // 规范化：清不可见字符、全角→半角、各类运算符号统一、去千分位分隔符
  function normalizeExpr(s) {
    return stripInvisible(s)
      .replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0)) // 全角数字
      .replace(/[．｡。]/g, '.')                                  // 各种点 → 小数点
      .replace(/[×✕⨯⋅·∗＊]/g, '*')                              // 乘
      .replace(/[÷∕⁄／]/g, '/')                                 // 除（含各种斜杠）
      .replace(/[−–—－﹣]/g, '-')                                // 各种减号 / 连字符
      .replace(/[＋﹢]/g, '+')                                   // 全角加
      .replace(/[（]/g, '(')
      .replace(/[）]/g, ')')
      .replace(/[％]/g, '%')
      .replace(/[,，、'’＇]/g, '')                               // 千分位分隔符（逗号/中文逗号/撇号等）
      .replace(/\s+/g, '');                                     // 去掉所有空白（普通/全角/窄空格也算千分位）
  }

  // 词法分析
  function tokenize(s) {
    const tokens = [];
    let i = 0;
    while (i < s.length) {
      const c = s[i];
      if ((c >= '0' && c <= '9') || c === '.') {
        let num = '';
        let dot = 0;
        while (i < s.length && ((s[i] >= '0' && s[i] <= '9') || s[i] === '.')) {
          if (s[i] === '.' && ++dot > 1) throw new Error('数字格式有误');
          num += s[i++];
        }
        tokens.push({ t: 'num', v: parseFloat(num) });
        continue;
      }
      if ('+-*/%()'.includes(c)) { tokens.push({ t: c }); i++; continue; }
      throw new Error('无法识别的字符“' + c + '”');
    }
    return tokens;
  }

  // 递归下降求值（标准优先级：先 * /，后 + -；支持括号、一元正负、后缀 %）
  function evalExpr(raw) {
    const tokens = tokenize(normalizeExpr(raw));
    if (tokens.length === 0) throw new Error('表达式为空');
    let pos = 0;
    const peek = () => tokens[pos];
    const eat  = () => tokens[pos++];

    function parseExpr() {
      let v = parseTerm();
      while (peek() && (peek().t === '+' || peek().t === '-')) {
        const op = eat().t;
        const rhs = parseTerm();
        v = op === '+' ? v + rhs : v - rhs;
      }
      return v;
    }
    function parseTerm() {
      let v = parseFactor();
      while (peek() && (peek().t === '*' || peek().t === '/')) {
        const op = eat().t;
        const rhs = parseFactor();
        if (op === '*') v = v * rhs;
        else {
          if (rhs === 0) throw new Error('除数不能为 0');
          v = v / rhs;
        }
      }
      return v;
    }
    function parseFactor() {
      const t = peek();
      if (!t) throw new Error('表达式不完整');
      if (t.t === '+') { eat(); return parseFactor(); }
      if (t.t === '-') { eat(); return -parseFactor(); }
      let v;
      if (t.t === '(') {
        eat();
        v = parseExpr();
        if (!peek() || peek().t !== ')') throw new Error('括号不匹配');
        eat();
      } else if (t.t === 'num') {
        eat();
        v = t.v;
      } else {
        throw new Error('意外的符号“' + t.t + '”');
      }
      while (peek() && peek().t === '%') { eat(); v = v / 100; }   // 后缀百分号
      return v;
    }

    const result = parseExpr();
    if (pos < tokens.length) throw new Error('表达式有多余的符号');
    if (!isFinite(result)) throw new Error('结果无效');
    return result;
  }

  // 两数是否相等（容忍金额四舍五入到两位 & 浮点误差）
  function approxEqual(a, b) {
    if (a === b) return true;
    if (Math.round(a * 100) === Math.round(b * 100)) return true;
    return Math.abs(a - b) <= 1e-9 * Math.max(1, Math.abs(a), Math.abs(b));
  }

  // 检查单行
  function checkLine(line) {
    const segs = line.split(/[=＝]/).map(s => s.trim()).filter(s => s !== '');
    if (segs.length === 0) return null;
    try {
      const values = segs.map(evalExpr);
      if (segs.length === 1) {
        return { line, status: 'calc', computed: values[0] };
      }
      const base = values[0];
      const ok = values.every(v => approxEqual(v, base));
      return {
        line, status: ok ? 'correct' : 'wrong',
        computed: base, claimed: values[values.length - 1]
      };
    } catch (e) {
      return { line, status: 'error', message: e.message };
    }
  }

  function checkPasted() {
    const raw = pasteInput.value;
    const lines = raw.split('\n').map(l => l.trim()).filter(l => l !== '');
    if (lines.length === 0) {
      checkResult.innerHTML = '<div class="check-summary">请输入要检查的算式</div>';
      return;
    }
    const results = lines.map(checkLine).filter(Boolean);
    renderCheckResults(results);
  }

  function renderCheckResults(results) {
    let okN = 0, badN = 0, errN = 0;
    const rows = results.map(r => {
      if (r.status === 'correct') {
        okN++;
        return `<div class="check-line ok">
          <span class="ico">✅</span>
          <span class="body"><span class="expr-txt">${esc(r.line)}</span>
            <span class="note">正确 · 结果 = <span class="right">${format(r.computed)}</span></span></span>
        </div>`;
      }
      if (r.status === 'wrong') {
        badN++;
        const diff = Math.abs(r.computed - r.claimed);
        return `<div class="check-line bad">
          <span class="ico">❌</span>
          <span class="body"><span class="expr-txt">${esc(r.line)}</span>
            <span class="note">错误 · 你写的是 ${format(r.claimed)}，正确答案应为 <span class="right">${format(r.computed)}</span>（相差 ${format(diff)}）</span></span>
        </div>`;
      }
      if (r.status === 'calc') {
        return `<div class="check-line warn">
          <span class="ico">🧮</span>
          <span class="body"><span class="expr-txt">${esc(r.line)}</span>
            <span class="note">没有写答案 · 算出来 = <span class="right">${format(r.computed)}</span></span></span>
        </div>`;
      }
      errN++;
      return `<div class="check-line warn">
        <span class="ico">⚠️</span>
        <span class="body"><span class="expr-txt">${esc(r.line)}</span>
          <span class="note">无法解析：${esc(r.message)}</span></span>
      </div>`;
    }).join('');

    const parts = [`共 ${results.length} 条`];
    if (okN)  parts.push(`<span class="ok-c">✅ ${okN} 正确</span>`);
    if (badN) parts.push(`<span class="bad-c">❌ ${badN} 错误</span>`);
    if (errN) parts.push(`⚠️ ${errN} 无法解析`);
    checkResult.innerHTML =
      `<div class="check-summary">${parts.join('　')}</div>` + rows;

    if (badN > 0) showToast(`发现 ${badN} 处错误`);
    else if (okN > 0 && errN === 0) showToast('全部正确 🎉');
  }

  checkBtn.addEventListener('click', checkPasted);
  clearPasteBtn.addEventListener('click', () => {
    pasteInput.value = '';
    checkResult.innerHTML = '';
    pasteInput.focus();
  });
  pasteInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      checkPasted();
    }
  });

  // ===== 初始化 =====
  addStep('*', '0.5');   // 默认带一步运算
  renderHistory();
  validate();
</script>
</body>
</html>
