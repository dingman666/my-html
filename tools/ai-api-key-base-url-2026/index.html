    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 100;

    height: 44px;

    border: 1px solid var(--card-border);
    background: var(--card-bg);
    font-size: 1.25em;
    cursor: pointer;
    box-shadow: 0 2px 12px rgba(0,0,0,0.18);

    align-items: center;
    justify-content: center;

    color: var(--mark-text);

    border-radius: 2px;

  .header h1 {
    font-size: 2.2em;
    background: linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;

  .header p { color: var(--text-dim); font-size: 1.05em; }
  .header .update-badge {

    margin-top: 12px;
    padding: 4px 16px;
    background: rgba(0,184,148,0.12);
    border: 1px solid rgba(0,184,148,0.3);
    border-radius: 20px;
    color: var(--success);
    font-size: 0.85em;
  }

    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    padding: 20px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .filter-btn {
    padding: 7px 18px;
    border: 1px solid var(--card-border);
    border-radius: 20px;
    background: var(--card-bg);
    color: var(--text-dim);
    cursor: pointer;
    font-size: 0.88em;
    transition: all 0.25s;
    white-space: nowrap;
  }
  .filter-btn:hover, .filter-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* Stats Bar */
  .stats-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    padding: 10px 20px 25px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .stat-item {
    text-align: center;
    padding: 10px 22px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    min-width: 120px;
  }
  .stat-item .num { font-size: 1.8em; font-weight: 700; color: var(--accent2); }
  .stat-item .label { font-size: 0.8em; color: var(--text-dim); margin-top: 2px; }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 18px;
    padding: 10px 20px 40px;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* Card */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s, background 0.3s, border-color 0.3s;
    display: flex;
    flex-direction: column;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 30px var(--shadow);
  }
  .card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--card-border);
  }
  .card-icon {
    width: 40px; height: 40px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3em;
    flex-shrink: 0;

  .card-title { font-size: 1.1em; font-weight: 700; }
  .card-provider { font-size: 0.78em; color: var(--text-dim); margin-top: 1px; }

  .card-body { padding: 14px 18px; flex: 1; }

    display: flex;
    align-items: flex-start;
    margin-bottom: 10px;
    gap: 8px;
  }
  .info-label {
    font-size: 0.78em;
    color: var(--text-dim);
    min-width: 72px;
    padding-top: 3px;
    flex-shrink: 0;
  }
  .info-value {
    font-family: 'Cascadia Code', 'Fira Code', monospace;
    font-size: 0.82em;
    word-break: break-all;
    color: var(--accent2);
    background: rgba(0,206,201,0.06);
    padding: 2px 8px;
    border-radius: 5px;
    flex: 1;
  }
  .info-value.key-format { color: var(--accent3); background: rgba(253,203,110,0.06); }

  .models-section { margin-top: 6px; }

    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;

  .models-label {
    font-size: 0.78em;
    color: var(--text-dim);

    padding: 2px 10px;
    border-radius: 5px;
    border: 1px solid var(--card-border);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.2s;

    flex-wrap: wrap;

    gap: 3px;
    padding: 2px 10px;
    border-radius: 5px;
    font-family: 'Cascadia Code', 'Fira Code', monospace;
    font-size: 0.73em;
    background: var(--tag-bg);
    color: var(--accent);

    transition: all 0.2s;
    border: 1px solid transparent;

    color: #fff;

// ============ RENDER ============
function renderCards(data) {
  const grid = document.getElementById('cardGrid');
  grid.innerHTML = '';
  let totalModels = 0;

  data.forEach((p, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.cat = p.cat;

    const protocolHTML = p.protocol.map(prot => {
      const cls = prot === 'openai' ? 'pb-openai' : prot === 'anthropic' ? 'pb-anthropic' : prot === 'native' ? 'pb-native' : 'pb-aws';
      const label = prot === 'openai' ? 'OpenAI兼容' : prot === 'anthropic' ? 'Anthropic兼容' : prot === 'native' ? '原生协议' : 'AWS SDK';
      return `<span class="protocol-badge ${cls}">${label}</span>`;
    }).join('');

    const modelTags = p.models.map(m => `<span class="model-tag" data-model="${m}">${m}</span>`).join('');

    const notesHTML = p.notes.map(n => {
      const cls = n.type === 'danger' ? 'note' : n.type === 'green' ? 'note green' : 'note dim';
      return `<div class="${cls}">${n.text}</div>`;
    }).join('');

    card.innerHTML = `
      <div class="card-header">
        <div class="card-icon" style="background:${p.iconBg}">${p.icon}</div>
        <div>
          <div class="card-title">${p.name}</div>
          <div class="card-provider">${p.provider}</div>
        </div>
      </div>
      <div class="card-body">
        <div class="info-row">
          <div class="info-label">Key 前缀</div>
          <div class="info-value key-format">${p.keyPrefix}</div>
        </div>
        <div class="info-row">
          <div class="info-label">Key 格式</div>
          <div class="info-value key-format">${p.keyFormat}</div>
        </div>
        <div class="info-row">
          <div class="info-label">Base URL</div>
          <div class="info-value">${p.baseUrl.replace(/\n/g,'<br>')}</div>
        </div>
        <div class="models-section">
          <div class="models-header">
            <div class="models-label">📦 常用模型（点击复制）</div>
            <button class="copy-all-btn" data-idx="${idx}">复制全部</button>
          </div>
          <div class="model-tags">${modelTags}</div>
        </div>
        <div class="protocol-badges">${protocolHTML}</div>
      </div>
      <div class="card-footer">${notesHTML}</div>
    `;
    grid.appendChild(card);
    totalModels += p.models.length;
  });

  document.getElementById('statTotal').textContent = data.length;
  document.getElementById('statModels').textContent = totalModels;
  document.getElementById('statOpenai').textContent = data.filter(p => p.protocol.includes('openai')).length;
  document.getElementById('statCats').textContent = new Set(data.map(p => p.cat)).size;
}

// ============ FILTER ============
let currentFilter = 'all';
function applyFilter(cat) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
  // 切换分类时清空搜索，避免与全局搜索状态冲突
  const searchBox = document.getElementById('searchBox');
  if (searchBox.value) {
    searchBox.value = '';
    document.querySelectorAll('.model-tag').forEach(tag => {
      tag.innerHTML = tag.dataset.model;
    });
  }
  const cards = document.querySelectorAll('.card');
  cards.forEach(c => {
    if (cat === 'all' || c.dataset.cat === cat) {
      c.style.display = '';
    } else {
      c.style.display = 'none';
    }
  });
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => applyFilter(btn.dataset.cat));
});

// ============ SEARCH ============
document.getElementById('searchBox').addEventListener('input', function() {
  const q = this.value.toLowerCase().trim();
  if (!q) {
    // 清空搜索时恢复分类筛选
    document.querySelectorAll('.card').forEach(c => {
      c.style.display = (currentFilter === 'all' || c.dataset.cat === currentFilter) ? '' : 'none';
    });
    // 清除高亮
    document.querySelectorAll('.model-tag').forEach(tag => {
      tag.innerHTML = tag.dataset.model;
    });
    return;
  }

  // 搜索为全局匹配，不受分类筛选影响；同步把分类高亮切回"全部平台"
  if (currentFilter !== 'all') {
    currentFilter = 'all';
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === 'all'));
  }
  document.querySelectorAll('.card').forEach(c => {
    const text = c.textContent.toLowerCase();
    const matches = text.includes(q);
    c.style.display = matches ? '' : 'none';

    // 高亮匹配的模型名
    if (matches) {
      c.querySelectorAll('.model-tag').forEach(tag => {
        const modelName = tag.dataset.model;
        if (modelName.toLowerCase().includes(q)) {
          const regex = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
          tag.innerHTML = modelName.replace(regex, '<mark class="hl">$1</mark>');
        } else {
          tag.innerHTML = modelName;
        }
      });
    }
  });
});

// ============ COPY ============
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

document.addEventListener('click', function(e) {
  // Copy single model
  if (e.target.classList.contains('model-tag')) {
    const model = e.target.dataset.model;
    navigator.clipboard.writeText(model).then(() => {
      e.target.classList.add('copied');
      showToast(`✅ 已复制: ${model}`);
      setTimeout(() => e.target.classList.remove('copied'), 1500);
    });
  }
  // Copy all models（英文逗号分隔，可直接粘贴到 NEW API 等渠道的模型列表）
  if (e.target.classList.contains('copy-all-btn')) {
    const btn = e.target;
    const idx = parseInt(btn.dataset.idx);
    const p = platforms[idx];
    const text = p.models.join(',');
    navigator.clipboard.writeText(text).then(() => {
      showToast(`✅ 已复制 ${p.models.length} 个模型（逗号分隔）`);
      btn.textContent = '✅ 已复制';
      setTimeout(() => { btn.textContent = '复制全部'; }, 1500);
    });
  }
});

// ============ THEME TOGGLE ============
const themeToggle = document.getElementById('themeToggle');
function syncThemeIcon() {
  // 黑夜模式显示太阳（点击切到白天），白天模式显示月亮
  themeToggle.textContent = document.documentElement.dataset.theme === 'light' ? '🌙' : '🌞';
}
themeToggle.addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('theme', next);
  syncThemeIcon();
});
syncThemeIcon();

// ============ INIT ============
renderCards(platforms);
</script>
