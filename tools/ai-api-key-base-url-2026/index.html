<style>
  :root {
    --bg: #0f1117;
    --card-bg: #1a1d2e;
    --card-border: #2a2d3e;
    --accent: #6c5ce7;
    --accent2: #00cec9;
    --accent3: #fdcb6e;
    --accent4: #e17055;
    --accent5: #00b894;
    --accent6: #fd79a8;
    --text: #e4e6eb;
    --text-dim: #8b8fa3;
    --tag-bg: rgba(108,92,231,0.15);
    --tag-bg2: rgba(0,206,201,0.15);
    --tag-bg3: rgba(253,203,110,0.15);
    --tag-bg4: rgba(225,112,85,0.15);
    --tag-bg5: rgba(0,184,148,0.15);
    --tag-bg6: rgba(253,121,168,0.15);
    --success: #00b894;
    --danger: #e17055;
    --shadow: rgba(108,92,231,0.12);
    --mark-text: #1a1d2e;
  }
  [data-theme="light"] {
    --bg: #f3f4f8;
    --card-bg: #ffffff;
    --card-border: #e2e5ee;
    --accent: #5b4bd5;
    --accent2: #0a9396;
    --accent3: #a06a00;
    --accent4: #d35400;
    --accent5: #009474;
    --accent6: #c2185b;
    --text: #2d3436;
    --text-dim: #6b7280;
    --tag-bg: rgba(91,75,213,0.10);
    --tag-bg2: rgba(10,147,150,0.10);
    --tag-bg3: rgba(160,106,0,0.10);
    --tag-bg4: rgba(211,84,0,0.10);
    --tag-bg5: rgba(0,148,116,0.10);
    --tag-bg6: rgba(194,24,91,0.10);
    --shadow: rgba(91,75,213,0.18);
    --mark-text: #2d3436;

  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
    transition: background 0.3s, color 0.3s;
  }
  /* Top-right buttons */
  .top-actions {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 100;
    display: flex;
    gap: 8px;
  }
  .theme-toggle, .export-btn {
    height: 44px;
    border-radius: 22px;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    color: var(--text);
    cursor: pointer;
    box-shadow: 0 2px 12px rgba(0,0,0,0.18);
    transition: transform 0.2s, background 0.3s, border-color 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .theme-toggle { width: 44px; font-size: 1.25em; }
  .export-btn { padding: 0 16px; font-size: 0.85em; gap: 6px; }
  .theme-toggle:hover { transform: scale(1.1) rotate(15deg); border-color: var(--accent); }
  .export-btn:hover { border-color: var(--accent); color: var(--accent); }
  mark.hl {
    background: var(--accent3);
    color: var(--mark-text);
    padding: 0 2px;
    border-radius: 2px;
  }
  /* Header */
  .header {
    text-align: center;
    padding: 50px 20px 30px;
    background: linear-gradient(135deg, rgba(108,92,231,0.08) 0%, rgba(0,206,201,0.06) 50%, rgba(253,203,110,0.04) 100%);
    border-bottom: 1px solid var(--card-border);
  }
  .header h1 {
    font-size: 2.2em;
    background: linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
  }
  .header p { color: var(--text-dim); font-size: 1.05em; }
  .header .update-badge {
    display: inline-block;
    margin-top: 12px;
    padding: 4px 16px;
    background: rgba(0,184,148,0.12);
    border: 1px solid rgba(0,184,148,0.3);
    border-radius: 20px;
    color: var(--success);
    font-size: 0.85em;
  }

  /* Filter Bar */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    padding: 20px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .filter-btn {
    padding: 7px 18px;
    border: 1px solid var(--card-border);
    border-radius: 20px;
    background: var(--card-bg);
    color: var(--text-dim);
    cursor: pointer;
    font-size: 0.88em;
    transition: all 0.25s;
    white-space: nowrap;
  }
  .filter-btn:hover, .filter-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* Stats Bar */
  .stats-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    padding: 10px 20px 25px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .stat-item {
    text-align: center;
    padding: 10px 22px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    min-width: 120px;
  }
  .stat-item .num { font-size: 1.8em; font-weight: 700; color: var(--accent2); }
  .stat-item .label { font-size: 0.8em; color: var(--text-dim); margin-top: 2px; }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 18px;
    padding: 10px 20px 40px;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* Card */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s, background 0.3s, border-color 0.3s;
    display: flex;
    flex-direction: column;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 30px var(--shadow);
  }
  .card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--card-border);
  }
  .card-icon {
    width: 40px; height: 40px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3em;
    flex-shrink: 0;
  }
  .card-title { font-size: 1.1em; font-weight: 700; }
  .card-provider { font-size: 0.78em; color: var(--text-dim); margin-top: 1px; }

  /* Card Body */
  .card-body { padding: 14px 18px; flex: 1; }
  .info-row {
    display: flex;
    align-items: flex-start;
    margin-bottom: 10px;
    gap: 8px;
  }
  .info-label {
    font-size: 0.78em;
    color: var(--text-dim);
    min-width: 72px;
    padding-top: 3px;
    flex-shrink: 0;
  }
  .info-value {
    font-family: 'Cascadia Code', 'Fira Code', monospace;
    font-size: 0.82em;
    word-break: break-all;
    color: var(--accent2);
    background: rgba(0,206,201,0.06);
    padding: 2px 8px;
    border-radius: 5px;
    flex: 1;
    cursor: pointer;
  }
  .info-value:hover { outline: 1px solid var(--accent2); }
  .info-value.key-format { color: var(--accent3); background: rgba(253,203,110,0.06); }
  .info-value.key-format:hover { outline-color: var(--accent3); }
  .info-value.auth { color: var(--accent6); background: rgba(253,121,168,0.06); cursor: default; }
  .info-value.auth:hover { outline: none; }
  .info-value.link { cursor: default; }
  .info-value.link:hover { outline: none; }
  .info-value a { color: var(--accent); text-decoration: none; }
  .info-value a:hover { text-decoration: underline; }
  .url-line { display: block; }
  .url-line .url-tag { color: var(--text-dim); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 0.9em; margin-right: 4px; }

  /* Models Section */
  .models-section { margin-top: 6px; }
  .models-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .models-label {
    font-size: 0.78em;
    color: var(--text-dim);
  }
  .copy-all-btn {
    font-size: 0.72em;
    padding: 2px 10px;
    border-radius: 5px;
    border: 1px solid var(--card-border);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.2s;
  }
  .copy-all-btn:hover { border-color: var(--accent); color: var(--accent); }
  .model-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .model-tag {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 2px 10px;
    border-radius: 5px;
    font-family: 'Cascadia Code', 'Fira Code', monospace;
    font-size: 0.73em;
    background: var(--tag-bg);
    color: var(--accent);
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid transparent;
    user-select: none;
  }
  .model-tag:hover {
    background: var(--accent);
    color: #fff;
    transform: scale(1.05);
  }
  .model-tag.copied {
    background: var(--success) !important;
    color: #fff !important;
    border-color: var(--success) !important;
  }

  .protocol-badges {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 10px;
  }
  .protocol-badge {
    font-size: 0.7em;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 600;
  }

  .pb-anthropic { background: var(--tag-bg4); color: var(--accent4); }
  .pb-native { background: var(--tag-bg3); color: #b8860b; }
  .pb-aws { background: var(--tag-bg5); color: var(--accent5); }
  .pb-gemini { background: var(--tag-bg2); color: var(--accent2); }

  /* Card Footer */
  .card-footer {
    padding: 10px 18px 14px;
    border-top: 1px solid var(--card-border);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .card-footer .note {
    font-size: 0.73em;
    color: var(--danger);
    background: rgba(225,112,85,0.08);
    padding: 3px 10px;
    border-radius: 5px;
    line-height: 1.5;
  }
  .card-footer .note.green { color: var(--success); background: rgba(0,184,148,0.08); }
  .card-footer .note.dim { color: var(--text-dim); background: rgba(139,143,163,0.08); }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--success);
    color: #fff;
    padding: 10px 24px;
    border-radius: 10px;
    font-size: 0.9em;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s;
    z-index: 999;
    box-shadow: 0 4px 20px rgba(0,184,148,0.3);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Search */
  .search-wrap {
    max-width: 560px;
    margin: 0 auto 10px;
    padding: 0 20px;
  }
  .search-box {
    width: 100%;
    padding: 10px 18px;
    border-radius: 12px;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 0.95em;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-box:focus { border-color: var(--accent); }
  .search-box::placeholder { color: var(--text-dim); }

  .empty-tip { text-align: center; color: var(--text-dim); padding: 40px 20px; grid-column: 1 / -1; }

  /* Responsive */
  @media (max-width: 500px) {
    .grid { grid-template-columns: 1fr; padding: 10px 10px 30px; }
    .header h1 { font-size: 1.5em; }
    .stats-bar { gap: 10px; }
    .stat-item { min-width: 90px; padding: 8px 14px; }
    .export-btn span.txt { display: none; }
  }
</style>
<script>
// 提前应用主题，避免刷新时闪烁
(function() {
  const saved = localStorage.getItem('theme');
  const theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  document.documentElement.dataset.theme = theme;
})();
</script>

// ============ HELPERS ============
function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
// 把 "标签: URL" 多行文本渲染为带标签的行
function renderUrlLines(text) {
  return text.split('\n').map(line => {
    const m = line.match(/^([^:]{1,24}):\s+(.+)$/);
    if (m && !/^https?$/.test(m[1])) {
      return `<span class="url-line" data-copy="${escapeHtml(m[2])}"><span class="url-tag">${escapeHtml(m[1])}:</span>${escapeHtml(m[2])}</span>`;
    }
    return `<span class="url-line" data-copy="${escapeHtml(line)}">${escapeHtml(line)}</span>`;
  }).join('');
}

// ============ RENDER ============
function renderCards(data) {
  const grid = document.getElementById('cardGrid');
  grid.innerHTML = '';
  let totalModels = 0;

  data.forEach((p, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.cat = p.cat;

    const protocolHTML = p.protocol.map(prot => {
      const m = PROTO_META[prot] || PROTO_META.native;
      return `<span class="protocol-badge ${m.cls}">${m.label}</span>`;
    }).join('');

    const modelTags = p.models.map(m => `<span class="model-tag" data-model="${escapeHtml(m)}">${escapeHtml(m)}</span>`).join('');

    const notesHTML = (p.notes || []).map(n => {
      const cls = n.type === 'danger' ? 'note' : n.type === 'green' ? 'note green' : 'note dim';
      return `<div class="${cls}">${escapeHtml(n.text)}</div>`;
    }).join('');

    const consoleHTML = p.console
      ? `<div class="info-row"><div class="info-label">获取 Key</div><div class="info-value link"><a href="${escapeHtml(p.console)}" target="_blank" rel="noopener">${escapeHtml(p.console.replace(/^https?:\/\//,''))}</a></div></div>`
      : '';

    card.innerHTML = `
      <div class="card-header">
        <div class="card-icon" style="background:${p.iconBg}">${p.icon}</div>
        <div>
          <div class="card-title">${escapeHtml(p.name)}</div>
          <div class="card-provider">${escapeHtml(p.provider)}</div>
        </div>
      </div>
      <div class="card-body">
        <div class="info-row">
          <div class="info-label">Key 前缀</div>
          <div class="info-value key-format" data-copy="${escapeHtml(p.keyPrefix)}" title="点击复制">${escapeHtml(p.keyPrefix)}</div>
        </div>
        <div class="info-row">
          <div class="info-label">Key 格式</div>
          <div class="info-value key-format" data-copy="${escapeHtml(p.keyFormat)}" title="点击复制">${escapeHtml(p.keyFormat)}</div>
        </div>
        <div class="info-row">
          <div class="info-label">鉴权方式</div>
          <div class="info-value auth">${escapeHtml(p.auth || '')}</div>
        </div>
        <div class="info-row">
          <div class="info-label">Base URL</div>
          <div class="info-value" title="点击某一行复制该 URL">${renderUrlLines(p.baseUrl)}</div>
        </div>
        ${consoleHTML}
        <div class="models-section">
          <div class="models-header">
            <div class="models-label">📦 常用模型（点击复制）</div>
            <button class="copy-all-btn" data-idx="${idx}">复制全部</button>
          </div>
          <div class="model-tags">${modelTags}</div>
        </div>
        <div class="protocol-badges">${protocolHTML}</div>
      </div>
      <div class="card-footer">${notesHTML}</div>
    `;
    grid.appendChild(card);
    totalModels += p.models.length;
  });

  document.getElementById('statTotal').textContent = data.length;
  document.getElementById('statModels').textContent = totalModels;
  document.getElementById('statOpenai').textContent = data.filter(p => p.protocol.includes('openai')).length;
  document.getElementById('statAnthropic').textContent = data.filter(p => p.protocol.includes('anthropic')).length;
  document.getElementById('statCats').textContent = new Set(data.map(p => p.cat)).size;
}

// ============ FILTER ============
let currentFilter = 'all';
function applyFilter(cat) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
  // 切换分类时清空搜索，避免与全局搜索状态冲突
  const searchBox = document.getElementById('searchBox');
  if (searchBox.value) {
    searchBox.value = '';
    document.querySelectorAll('.model-tag').forEach(tag => {
      tag.textContent = tag.dataset.model;
    });
  }
  const cards = document.querySelectorAll('.card');
  cards.forEach(c => {
    c.style.display = (cat === 'all' || c.dataset.cat === cat) ? '' : 'none';
  });
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => applyFilter(btn.dataset.cat));
});

// ============ SEARCH ============
document.getElementById('searchBox').addEventListener('input', function() {
  const q = this.value.toLowerCase().trim();
  if (!q) {
    document.querySelectorAll('.card').forEach(c => {
      c.style.display = (currentFilter === 'all' || c.dataset.cat === currentFilter) ? '' : 'none';
    });
    document.querySelectorAll('.model-tag').forEach(tag => {
      tag.textContent = tag.dataset.model;
    });
    return;
  }

  // 搜索为全局匹配，不受分类筛选影响；同步把分类高亮切回"全部平台"
  if (currentFilter !== 'all') {
    currentFilter = 'all';
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === 'all'));
  }
  const regex = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
  document.querySelectorAll('.card').forEach(c => {
    const text = c.textContent.toLowerCase();
    const matches = text.includes(q);
    c.style.display = matches ? '' : 'none';

    if (matches) {
      c.querySelectorAll('.model-tag').forEach(tag => {
        const modelName = tag.dataset.model;
        if (modelName.toLowerCase().includes(q)) {
          tag.innerHTML = escapeHtml(modelName).replace(regex, '<mark class="hl">$1</mark>');
        } else {
          tag.textContent = modelName;
        }
      });
    }
  });
});

// ============ COPY ============
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
function copyText(text, msg) {
  navigator.clipboard.writeText(text).then(() => showToast(msg || `✅ 已复制: ${text}`));
}

document.addEventListener('click', function(e) {
  const t = e.target;
  // Copy single model
  if (t.classList.contains('model-tag')) {
    const model = t.dataset.model;
    navigator.clipboard.writeText(model).then(() => {
      t.classList.add('copied');
      showToast(`✅ 已复制: ${model}`);
      setTimeout(() => t.classList.remove('copied'), 1500);
    });
    return;
  }
  // Copy all models（英文逗号分隔，可直接粘贴到 NEW API 等渠道的模型列表）
  if (t.classList.contains('copy-all-btn')) {
    const idx = parseInt(t.dataset.idx);
    const p = platforms[idx];
    navigator.clipboard.writeText(p.models.join(',')).then(() => {
      showToast(`✅ 已复制 ${p.models.length} 个模型（逗号分隔）`);
      t.textContent = '✅ 已复制';
      setTimeout(() => { t.textContent = '复制全部'; }, 1500);
    });
    return;
  }
  // Copy a URL line
  const urlLine = t.closest('.url-line');
  if (urlLine) { copyText(urlLine.dataset.copy); return; }
  // Copy key prefix / format
  const kv = t.closest('.info-value.key-format');
  if (kv && kv.dataset.copy) { copyText(kv.dataset.copy); return; }
});

// ============ EXPORT MARKDOWN ============
function buildMarkdown() {
  const order = ['international','domestic','cloud','aggregate','media','local'];
  const esc = s => String(s).replace(/\|/g,'\\|').replace(/\n/g,'<br>');
  let md = `# AI 大模型 API Key 格式 & Base URL 清单\n\n> 共 ${platforms.length} 个平台 · 更新至 2026 年 9 月\n\n`;
  order.forEach(cat => {
    const list = platforms.filter(p => p.cat === cat);
    if (!list.length) return;
    md += `## ${CAT_NAME[cat]}（${list.length}）\n\n`;
    md += `| 厂商 | Key 前缀 | Key 格式 | 鉴权方式 | Base URL | 获取 Key |\n|---|---|---|---|---|---|\n`;
    list.forEach(p => {
      md += `| **${esc(p.name)}** | \`${esc(p.keyPrefix)}\` | ${esc(p.keyFormat)} | ${esc(p.auth||'')} | ${esc(p.baseUrl)} | ${p.console ? esc(p.console) : ''} |\n`;
    });
    md += `\n`;
  });
  return md;
}
document.getElementById('exportBtn').addEventListener('click', () => {
  const md = buildMarkdown();
  const blob = new Blob([md], {type:'text/markdown;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'AI厂商-Key格式与BaseURL清单.md';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  showToast('📋 已导出 Markdown 清单');
});

// ============ THEME TOGGLE ============
const themeToggle = document.getElementById('themeToggle');
function syncThemeIcon() {
  themeToggle.textContent = document.documentElement.dataset.theme === 'light' ? '🌙' : '🌞';
}
themeToggle.addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('theme', next);
  syncThemeIcon();
});
syncThemeIcon();

// ============ INIT ============
renderCards(platforms);
</script>
